<!DOCTYPE html>

<style>
:root{
  --bg:#0A1118; --card:#131C26; --card2:#1B2733; --card3:#243342; --line:#26333F;
  --txt:#F0F5F8; --mute:#8FA3B0; --dim:#5D7080;
  --mint:#43E39B; --sky:#4FA9F5; --amber:#FFC24B; --coral:#FF7A5C; --lav:#B18CFF; --rose:#FF6F9C;
  --mono:ui-monospace,'SF Mono','Roboto Mono',Menlo,monospace;
  --disp:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:640px;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:14px 12px 78px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:12px}
.brand{font-family:var(--mono);font-size:7.5px;letter-spacing:.22em;color:var(--amber);text-transform:uppercase}
h1{font-family:var(--disp);font-size:23px;font-weight:400;margin:2px 0 0}
.meta{font-family:var(--mono);font-size:8.5px;color:var(--dim);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;
  animation:fi .35s cubic-bezier(.4,0,.2,1)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:11px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lbl b{color:var(--amber);font-weight:400}
.big{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
.kpi{background:var(--card2);border-radius:14px;padding:11px 12px}
.kpi .k{font-size:9.5px;color:var(--mute)}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:4px;line-height:1}
.kpi .s{font-size:8.5px;color:var(--dim);margin-top:4px}
button{font-family:var(--mono);cursor:pointer;border:none;border-radius:12px}
.btn{background:var(--amber);color:#0A1118;padding:12px 16px;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:700;width:100%}
.btn2{background:var(--card2);color:var(--mute);padding:9px 13px;font-size:9.5px;text-transform:uppercase}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:9px 11px;
  font-family:var(--mono);font-size:13px;width:100%;outline:none;border-radius:11px;-webkit-appearance:none}
label.f{font-size:9px;color:var(--mute);display:block;margin-bottom:4px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:rgba(19,28,38,.94);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:30}
nav button{flex:1;background:none;border-radius:0;padding:11px 1px 16px;color:var(--dim);font-size:8.5px}
nav button.on{color:var(--amber);font-weight:700}
nav button i{display:block;width:100%;height:2px;background:transparent;margin-bottom:8px;border-radius:2px}
nav button.on i{background:var(--amber)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--card2);font-size:12px}
.tag{border-radius:7px;padding:3px 7px;font-family:var(--mono);font-size:8px;font-weight:700;color:#0A1118;flex-shrink:0}
.pill{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:13px;margin-bottom:10px}
.pill button{flex:1;background:none;color:var(--mute);padding:9px 4px;font-size:10px;text-transform:uppercase}
.pill button.on{background:var(--card3);color:var(--amber);font-weight:700}
.ico{width:30px;height:30px;border-radius:10px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-bottom:10px}
.catgrid button{background:var(--card2);border:1.5px solid transparent;border-radius:13px;padding:8px 2px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-size:7.5px;line-height:1.1;text-align:center}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.chips button{flex:1 1 52px;background:var(--card2);color:var(--txt);padding:9px 2px;font-size:10px}
.acc{display:flex;gap:6px}
.acc button{flex:1;background:var(--card2);color:var(--mute);padding:11px 3px;font-size:10px}
.ch{width:100%;height:170px}
.ch.sm{height:120px}
.warn{padding:10px 12px;background:rgba(255,122,92,.1);border-radius:12px;font-size:11px;color:var(--coral);
  line-height:1.45;margin-top:9px}
.load{text-align:center;padding:70px 20px;color:var(--mute);font-family:var(--mono);font-size:12px}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex}
.ovl{position:fixed;inset:0;background:rgba(5,10,15,.82);backdrop-filter:blur(6px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;animation:fo .2s ease}
@keyframes fo{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;
  max-width:640px;max-height:82vh;overflow-y:auto;padding:18px 16px 28px;animation:up .28s cubic-bezier(.4,0,.2,1)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.tap{cursor:pointer;position:relative}
.tap:after{content:"›";position:absolute;right:11px;top:10px;color:var(--dim);font-size:17px}
</style>

<div id="app"><div class="load">Yuklanyapti…</div></div>

<script>
var API="https://script.google.com/macros/s/AKfycby0AbDC_RZEFG_Six9rwGsWrRlHDWM1hF5ykd_cU12F1SOGsJ9TVY_nLCNCB7sfOu7_/exec";
var MAXFIY="ram5657";

var D=null, tab="bugun", holat="", CH=[];
var KI={tur:"chiqim",kassa:"Karta",cat:"Korzinka",sum:0,izoh:""};
var MODAL=null, MOY=0, FMAJ_REJIM="bir";
function oyKey(off){var d=new Date(bugun());d.setDate(1);d.setMonth(d.getMonth()-(off||0));return d.toISOString().slice(0,7)}
function oyNom(off){
  var A=["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
  var d=new Date(bugun());d.setDate(1);d.setMonth(d.getMonth()-(off||0));
  return A[d.getMonth()]+" "+d.getFullYear();
}
var CATS=["Korzinka","Kommunal","Ayolimga","Qizim","Ota-ona","Transport","Sog'liq","Sadaqa","Qarz to'lovi","Bosmaxona","Tarjimon","Tahrir","Korrektura","Dizayn","Royalty","SMM","Xodim","Zaxira","Boshqa"];
var SHAX=["Korzinka","Kommunal","Ayolimga","Qizim","Ota-ona","Transport","Sog'liq","Sadaqa"];
var NASHR=["Bosmaxona","Tarjimon","Tahrir","Korrektura","Dizayn","Royalty","SMM","Xodim"];
var KAS=["Karta","Hisob","Shaxsiy"];
var CV=getComputedStyle(document.documentElement);
function c(v){return CV.getPropertyValue("--"+v).trim()}
var KCOL={Karta:c("sky"),Hisob:c("amber"),Shaxsiy:c("lav")};
var KNOM={Karta:"Karta",Hisob:"Hisob raqam",Shaxsiy:"Shaxsiy"};
var CCOL={Korzinka:c("mint"),Kommunal:c("sky"),Ayolimga:c("rose"),Qizim:c("lav"),"Ota-ona":c("lav"),
Transport:c("dim"),"Sog'liq":c("coral"),Sadaqa:c("mint"),"Qarz to'lovi":c("sky"),Bosmaxona:c("amber"),
Tarjimon:c("amber"),Tahrir:c("amber"),Korrektura:c("amber"),Dizayn:c("sky"),Royalty:c("coral"),SMM:c("amber"),Xodim:c("amber"),Zaxira:c("mint"),Boshqa:c("dim")};
var PALITRA=["#43E39B","#4FA9F5","#FFC24B","#FF7A5C","#B18CFF","#FF6F9C","#3FD9C9","#F5A65B",
"#7ED957","#6C8CFF","#FFD84D","#FF8FA3","#5BC0EB","#C77DFF","#FFAD5B","#4ECDC4","#F06595","#9BE564"];
var _RANG={},_RI=0;
function rangOl(nom){
  if(!_RANG[nom]){_RANG[nom]=PALITRA[_RI%PALITRA.length];_RI++}
  return _RANG[nom];
}
function ccol(x){
  var k=ikonaTop(x);
  if(CCOL[k]&&k!=="Boshqa")return CCOL[k];
  return CCOL[x]||rangOl(x);
}

function n(v){var x=Number(v);return isNaN(x)?0:x}
function fmt(v){return isNaN(v)||v===null?"—":Math.round(v).toLocaleString("ru-RU").replace(/,/g," ")}
function mln(v){return isNaN(v)||v===null?"—":(v/1e6).toFixed(1)}
function bugun(){return new Date(Date.now()+5*36e5).toISOString().slice(0,10)}
function kunTo(s){var t=new Date(s).getTime();return isNaN(t)?999:Math.round((t-new Date(bugun()).getTime())/864e5)}
function dOff(i){return new Date(new Date(bugun()).getTime()+i*864e5).toISOString().slice(0,10)}
function tr(v){return v===true||v==="TRUE"||v==="true"||v===1}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

var ICO={
 Korzinka:'<path d="M3 7h18l-2 12H5L3 7z"/><path d="M8 7V4a4 4 0 018 0v3"/>',
 Kommunal:'<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>',
 Ayolimga:'<circle cx="12" cy="7" r="4"/><path d="M12 11v7M9 21h6M9 15h6"/>',
 Qizim:'<circle cx="12" cy="8" r="3.5"/><path d="M6 21c0-4 2.7-6.5 6-6.5s6 2.5 6 6.5"/>',
 "Ota-ona":'<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M3 20c0-3 2.2-5 5-5M21 20c0-3-2.2-5-5-5"/>',
 Transport:'<path d="M4 15l2-6h12l2 6M3 15h18v4H3v-4z"/><circle cx="7" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/>',
 "Sog'liq":'<path d="M12 20s-7-4.5-7-9.5A4 4 0 0112 8a4 4 0 017 2.5c0 5-7 9.5-7 9.5z"/>',
 Sadaqa:'<path d="M4 13c2-3 5-3 8 0l4 4M4 13v6h13M17 10l3-3"/>',
 "Qarz to'lovi":'<path d="M3 12h14M13 7l5 5-5 5"/>',
 Bosmaxona:'<path d="M7 8V3h10v5M7 18v3h10v-3"/><rect x="3" y="8" width="18" height="10" rx="2"/>',
 Tarjimon:'<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/>',
 Tahrir:'<path d="M5 19h14M8 15l9-9 3 3-9 9H8v-3z"/>',
 Korrektura:'<path d="M4 12l5 5L20 6"/><path d="M4 19h16"/>',
 Dizayn:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>',
 Royalty:'<path d="M4 8l4 4 4-8 4 8 4-4v11H4V8z"/>',
 SMM:'<path d="M4 10v4h3l6 4V6l-6 4H4zM17 9a4 4 0 010 6"/>',
 Xodim:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M17 8h4M19 6v4"/>',
 Zaxira:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>',
 Kirim:'<path d="M12 20V5M7 10l5-5 5 5"/>',
 Tarqatuvchi:'<rect x="3" y="9" width="12" height="8" rx="1"/><path d="M15 12h3l3 3v2h-6"/><circle cx="7" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
 Boshqa:'<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>'};
function ikonaTop(nom){
  if(ICO[nom])return nom;
  var l=String(nom||"").toLowerCase();
  if(/taksi|transport|yo'l|benzin|avto|mashina/.test(l))return "Transport";
  if(/ovqat|restoran|kafe|non|market|do'kon|dokon/.test(l))return "Korzinka";
  if(/dori|shifokor|sog'liq|sogliq|tibbiy/.test(l))return "Sog'liq";
  if(/svet|gaz|suv|kommunal|internet|aloqa/.test(l))return "Kommunal";
  if(/xodim|ish haqi|oylik|maosh/.test(l))return "Xodim";
  if(/bosma|chop|tipograf/.test(l))return "Bosmaxona";
  if(/tarjim/.test(l))return "Tarjimon";
  if(/tahrir|muharrir/.test(l))return "Tahrir";
  if(/korrektura|korrektor/.test(l))return "Korrektura";
  if(/dizayn|muqova|maket/.test(l))return "Dizayn";
  if(/royalty|muallif/.test(l))return "Royalty";
  if(/smm|reklama|marketing/.test(l))return "SMM";
  if(/zaxira|jamg'arma|jamgarma/.test(l))return "Zaxira";
  if(/sadaqa|xayriya|ehson/.test(l))return "Sadaqa";
  if(/\bqarz\b/.test(l))return "Qarz to'lovi";
  if(/ayol|xotin/.test(l))return "Ayolimga";
  if(/qiz|bola|pampers/.test(l))return "Qizim";
  if(/cloud|obuna|subscription|dastur|hosting|domen|server/.test(l))return "Dastur";
  if(/tarqatuvchi/.test(l))return "Tarqatuvchi";
  return "Boshqa";
}
var ICO_QOSH={Dastur:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 4v5"/>'};
function ico(nom,col,sz){
 var k=ikonaTop(nom);
 var yol=ICO[k]||ICO_QOSH[k]||ICO.Boshqa;
 return '<svg width="'+(sz||16)+'" height="'+(sz||16)+'" viewBox="0 0 24 24" fill="none" stroke="'+(col||c("mute"))
  +'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+yol+'</svg>';
}

/* ═════ SERVER ═════ */
function api(p){
  var u=API+"?maxfiy="+encodeURIComponent(MAXFIY);
  for(var k in p) u+="&"+k+"="+encodeURIComponent(p[k]);
  return fetch(u).then(function(r){return r.json()});
}
function yukla(){return api({amal:"hammasi"}).then(function(j){if(!j.ok)throw new Error(j.xato||"xato");D=j.data;return D})}
function belgi(t){holat=t;var e=document.getElementById("holat");if(e)e.textContent=t;
  if(t)setTimeout(function(){holat="";var e2=document.getElementById("holat");if(e2)e2.textContent=""},1800)}
function qosh(v,o){belgi("saqlanyapti…");
  return api({amal:"qosh",varaq:v,obj:JSON.stringify(o)}).then(function(j){
    if(j.ok){if(!D[v])D[v]=[];D[v].push(j.obj);belgi("saqlandi");render()}else belgi("xato: "+j.xato)
  }).catch(function(){belgi("ulanmadi")})}
function yangi(v,id,m,q){belgi("saqlanyapti…");
  return api({amal:"yangila",varaq:v,id:id,maydon:m,qiymat:q}).then(function(j){
    if(j.ok){D[v].forEach(function(x){if(String(x.id)===String(id))x[m]=q});belgi("saqlandi");render()}
  }).catch(function(){belgi("ulanmadi")})}
function ochir(v,id){belgi("o'chirilyapti…");
  return api({amal:"ochir",varaq:v,id:id}).then(function(j){
    if(j.ok){D[v]=D[v].filter(function(x){return String(x.id)!==String(id)});belgi("o'chdi");render()}
  }).catch(function(){belgi("ulanmadi")})}
function kassaBelgila(nom,q){belgi("saqlanyapti…");
  return api({amal:"kassa",nom:nom,qiymat:q}).then(function(j){
    if(j.ok){var b=false;D.Kassa.forEach(function(x){if(x.nom===nom){x.boshlangich=q;b=true}});
      if(!b)D.Kassa.push({nom:nom,boshlangich:q});belgi("saqlandi");render()}
  }).catch(function(){belgi("ulanmadi")})}

/* ═════ HISOB ═════ */
function hisob(){
  var Y=D.Yozuv||[],M=D.Majburiyat||[],K=D.Kitob||[],T=D.Tarqatuvchi||[],S=D.Soglik||[],P=D.Prognoz||[];
  var m={};
  function s(t,k){return Y.filter(function(x){return x.tur===t&&(k?x.kassa===k:1)}).reduce(function(a,x){return a+n(x.summa)},0)}
  function ti(k){return Y.filter(function(x){return x.tur==="transfer"&&x.kassaTo===k}).reduce(function(a,x){return a+n(x.summa)},0)}
  function to(k){return Y.filter(function(x){return x.tur==="transfer"&&x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)}
  function b(k){var r=(D.Kassa||[]).filter(function(x){return x.nom===k})[0];return r?n(r.boshlangich):0}
  m.kas={};KAS.forEach(function(k){m.kas[k]=b(k)+s("kirim",k)-s("chiqim",k)+ti(k)-to(k)});
  m.kassa=KAS.reduce(function(a,k){return a+m.kas[k]},0);

  var i30=Y.filter(function(x){return kunTo(x.sana)>=-30});
  m.kirim30=i30.filter(function(x){return x.tur==="kirim"}).reduce(function(a,x){return a+n(x.summa)},0);
  m.chiqim30=i30.filter(function(x){return x.tur==="chiqim"}).reduce(function(a,x){return a+n(x.summa)},0);
  m.kirim7=Y.filter(function(x){return kunTo(x.sana)>=-7&&x.tur==="kirim"}).reduce(function(a,x){return a+n(x.summa)},0);

  m.ob=M.filter(function(x){return !tr(x.paid)}).map(function(o){
    var tol=Y.filter(function(x){return x.tur==="chiqim"&&String(x.objId)===String(o.id)});
    var jt=tol.reduce(function(a,x){return a+n(x.summa)},0)+n(o.tolangan);
    return {id:o.id,kim:o.kim,summa:n(o.summa),sana:o.sana,tur:o.tur,manbaK:o.manba||"Karta",tol:jt,
      qoldiq:Math.max(0,n(o.summa)-jt),foiz:n(o.summa)?Math.min(100,jt/n(o.summa)*100):0,
      manba:KAS.map(function(k){return{k:k,v:tol.filter(function(x){return x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)}})};
  });
  m.ob45=m.ob.filter(function(o){return kunTo(o.sana)<=45});
  m.ob45J=m.ob45.reduce(function(a,o){return a+o.qoldiq},0);
  m.kech=m.ob.filter(function(o){return kunTo(o.sana)<0});
  m.kut=(D.Kutilayotgan||[]).filter(function(x){return !tr(x.paid)});
  m.kutJ=m.kut.filter(function(x){return kunTo(x.sana)<=45}).reduce(function(a,x){return a+n(x.summa)},0);
  m.taqchillik=m.kassa+m.kutJ-m.ob45J;
  m.kunlar=m.chiqim30>0?Math.round(m.kassa/(m.chiqim30/30)):null;

  var oy=bugun().slice(0,7);
  m.prg=P.map(function(p){
    var cats=String(p.cats||"").split(",").map(function(x){return x.trim()});
    var sf=Y.filter(function(x){return x.tur==="chiqim"&&cats.indexOf(x.cat)>=0&&String(x.sana).slice(0,7)===oy});
    var j=sf.reduce(function(a,x){return a+n(x.summa)},0);
    return {nom:p.nom,summa:n(p.summa),ico:p.ico,sarf:j,foiz:n(p.summa)?j/n(p.summa)*100:0,
      manba:KAS.map(function(k){return{k:k,v:sf.filter(function(x){return x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)}})};
  });

  var db=0,dt=0,dy=0;
  T.forEach(function(x){var v=n(x.summa);if(x.tur==="boshlangich")db+=v;else if(x.tur==="tolov")dt+=v;else dy+=v});
  m.dist={bosh:db,tol:dt,yangi:dy,qarz:db+dy-dt,foiz:db+dy?dt/(db+dy)*100:0,
    harakat:T.filter(function(x){return x.tur!=="boshlangich"})};

  function nrmk(x){return String(x||"").trim().toLowerCase().replace(/['\u2018\u2019]/g,"")}
  var FOIZ={};
  (D.KitobFoiz||[]).forEach(function(r){
    if(!r.kitob)return;
    var v=Number(r.foiz);
    if(!isNaN(v))FOIZ[nrmk(r.kitob)]=v;
  });
  m.kitob=K.map(function(bk){
    var pre=n(bk.huquq)+n(bk.tarjima)+n(bk.tahrir)+n(bk.korrektura)+n(bk.dizayn)+n(bk.smm);
    var trj=(D.Tiraj||[]).filter(function(t){return nrmk(t.kitob)===nrmk(bk.nom)})
      .sort(function(a,b2){return n(a.raqam)-n(b2.raqam)});
    var tiraj=0,chop=0,jT=0,jC=0,narxsiz=false;
    if(trj.length){trj.forEach(function(t){
      var nu=n(t.nusxa),nx=n(t.narxDona);
      tiraj+=nu;chop+=nu*nx;
      if(String(t.holat)!=="yopilgan"){jT+=nu;jC+=nu*nx}
      else if(!nx)narxsiz=true;
    })}
    else{tiraj=n(bk.tiraj);chop=n(bk.chopDona)*tiraj;jT=tiraj;jC=chop}
    var xar=pre+chop;
    var sot=n(bk.s50)+n(bk.s60),tus=n(bk.s50)*n(bk.dist)+n(bk.s60)*n(bk.retail);
    var fk=nrmk(bk.nom);
    var foiz=8;
    if(bk.foiz!==undefined&&bk.foiz!==""&&!isNaN(Number(bk.foiz))) foiz=Number(bk.foiz);
    else if(FOIZ[fk]!==undefined) foiz=FOIZ[fk];
    var roy=tus*foiz/100;
    return {id:bk.id,nom:bk.nom,holat:bk.holat,izoh:bk.izoh,tiraj:tiraj,qoldiq:n(bk.qoldiq),
      dist:n(bk.dist),retail:n(bk.retail),pre:pre,xar:xar,sot:sot,tus:tus,roy:roy,foiz:foiz,
      tirajlar:trj,narxsiz:narxsiz,sof:tus-xar-roy,
      tannarx:(jT&&narxsiz)?(jC/jT+(tiraj?pre/tiraj:0)):(tiraj?xar/tiraj:0),
      qoldiqTolov:n(bk.qoldiqTolov)};
  });
  m.ombor=m.kitob.reduce(function(a,x){return a+x.qoldiq*x.dist},0);
  m.muzlagan=m.kitob.filter(function(x){return x.holat!=="Savdoda"}).reduce(function(a,x){return a+x.pre-x.qoldiqTolov},0);

  var s7=S.filter(function(x){return kunTo(x.sana)>=-7});
  m.sport7=s7.filter(function(x){return tr(x.sport)}).length;
  m.bomdod7=s7.filter(function(x){return tr(x.bomdod)}).length;
  m.oila7=s7.reduce(function(a,x){return a+n(x.oila)},0);
  m.vaznSer=S.filter(function(x){return n(x.vazn)>0}).sort(function(a,b2){return new Date(a.sana)-new Date(b2.sana)})
    .map(function(x){return [String(x.sana).slice(0,10),n(x.vazn)]});
  m.vazn=m.vaznSer.length?m.vaznSer[m.vaznSer.length-1][1]:null;

  var q=(D.Qarz||[])[0]||{};
  m.qarz={jami:n(q.jami),tolangan:n(q.tolangan),oylik:n(q.oylik),muddat:q.muddat,
    qoldiq:n(q.jami)-n(q.tolangan),foiz:n(q.jami)?n(q.tolangan)/n(q.jami)*100:0};
  var oq=q.muddat?Math.max(1,Math.round((new Date(q.muddat)-new Date(bugun()))/864e5/30.4)):null;
  m.qarz.oyQ=oq;m.qarz.temp=oq?m.qarz.qoldiq/oq:null;

  function nrm(t){return String(t||"").trim().toLowerCase().replace(/['\u2018\u2019]/g,"")}
  var joriyOyK=bugun().slice(0,7);
  var kir={},kirNom={};
  Y.forEach(function(x){
    if(x.tur!=="kirim")return;
    if(String(x.sana).slice(0,7)!==joriyOyK)return;
    var xom=x.cat||x.izoh||"Boshqa kirim";
    var k=nrm(xom);
    /* imlo farqi bo'lgan nomlarni birlashtirish */
    for(var mavjud in kirNom){
      if(mavjud===k)break;
      if(Math.abs(mavjud.length-k.length)<=2){
        var f=0,uz=Math.max(mavjud.length,k.length);
        for(var i2=0,j2=0;i2<mavjud.length||j2<k.length;){
          if(mavjud[i2]===k[j2]){i2++;j2++}
          else{f++;if(mavjud.length>k.length)i2++;else if(k.length>mavjud.length)j2++;else{i2++;j2++}}
          if(f>1)break;
        }
        if(f<=1){k=mavjud;break}
      }
    }
    if(!kirNom[k])kirNom[k]=xom.charAt(0).toUpperCase()+xom.slice(1);
    kir[k]=(kir[k]||0)+n(x.summa);
  });
  m.kirTaq=Object.keys(kir).map(function(k){return{n:kirNom[k]||k,v:kir[k],c:ccol(k)}}).sort(function(a,b2){return b2.v-a.v});
  m.kirJ=m.kirTaq.reduce(function(a,x){return a+x.v},0);
  var kirKas={};
  Y.forEach(function(x){if(x.tur==="kirim"&&String(x.sana).slice(0,7)===joriyOyK){kirKas[x.kassa]=(kirKas[x.kassa]||0)+n(x.summa)}});
  m.kirKassa=KAS.filter(function(k){return kirKas[k]>0}).map(function(k){return{n:KNOM[k],v:kirKas[k],c:KCOL[k]}});

  var kats={};
  Y.forEach(function(x){if(x.tur==="chiqim"&&x.cat&&String(x.sana).slice(0,7)===joriyOyK){kats[x.cat]=(kats[x.cat]||0)+n(x.summa)}});
  m.xar=Object.keys(kats).map(function(k){return{n:k,v:kats[k],c:ccol(k)}}).sort(function(a,b2){return b2.v-a.v});
  m.xarJ=m.xar.reduce(function(a,x){return a+x.v},0);
  function katGuruh(nom){
    if(SHAX.indexOf(nom)>=0)return "Shaxsiy";
    if(NASHR.indexOf(nom)>=0)return "Nashriyot";
    var r=(D.Kategoriya||[]).filter(function(x){return String(x.nom).toLowerCase()===String(nom).toLowerCase()})[0];
    if(r&&r.guruh)return /nashr/i.test(r.guruh)?"Nashriyot":"Shaxsiy";
    return null;
  }
  m.xarShax=m.xar.filter(function(x){return katGuruh(x.n)==="Shaxsiy"}).reduce(function(a,x){return a+x.v},0);
  m.xarNashr=m.xar.filter(function(x){return katGuruh(x.n)==="Nashriyot"}).reduce(function(a,x){return a+x.v},0);

  var kd=m.kirim30>0?m.kirim30/30:0;
  m.hor=[];var v={};KAS.forEach(function(k){v[k]=m.kas[k]});
  for(var i=0;i<=60;i++){
    var d=dOff(i);
    if(i>0){
      v.Karta+=kd;
      m.ob.forEach(function(o){if(o.sana===d){var mk=o.manbaK||"Karta";v[mk]=(v[mk]||0)-o.qoldiq}});
      m.kut.forEach(function(x){if(x.sana===d)v.Hisob+=n(x.summa)});
      if(new Date(d).getDate()===1)m.prg.forEach(function(p){v.Shaxsiy-=p.summa});
    }
    m.hor.push({d:d,K:v.Karta,H:v.Hisob,S:v.Shaxsiy});
  }
  var joriyOy=bugun().slice(0,7);
  var o=new Date(bugun()); o.setMonth(o.getMonth()-1);
  var otganOy=o.toISOString().slice(0,7);
  m.oy={joriy:joriyOy,otgan:otganOy};

  m.oyGuruh=function(tur,oy,filtr){
    var g={},j=0;
    Y.forEach(function(x){
      if(x.tur!==tur)return;
      if(String(x.sana).slice(0,7)!==oy)return;
      if(filtr&&!filtr(x))return;
      var k=x.cat||x.izoh||(tur==="kirim"?"Boshqa kirim":"Boshqa");
      g[k]=(g[k]||0)+n(x.summa); j+=n(x.summa);
    });
    return {lst:Object.keys(g).map(function(k){return{n:k,v:g[k]}}).sort(function(a,b2){return b2.v-a.v}),jami:j};
  };
  m.guruhNomi=katGuruh;

  function oyGuruh(tur,oy){
    var g={},j=0;
    Y.forEach(function(x){
      if(x.tur!==tur)return;
      if(String(x.sana).slice(0,7)!==oy)return;
      var k=x.cat||x.izoh||(tur==="kirim"?"Boshqa kirim":"Boshqa");
      g[k]=(g[k]||0)+n(x.summa); j+=n(x.summa);
    });
    return {lst:Object.keys(g).map(function(k){return{n:k,v:g[k]}}).sort(function(a,b2){return b2.v-a.v}),jami:j};
  }
  m.kirimOy={joriy:oyGuruh("kirim",joriyOy),otgan:oyGuruh("kirim",otganOy)};
  m.chiqimOy={joriy:oyGuruh("chiqim",joriyOy),otgan:oyGuruh("chiqim",otganOy)};

  /* draw harakatlari */
  function drawOy(oy){
    var g={},j=0;
    Y.forEach(function(x){
      if(x.tur!=="transfer")return;
      if(oy&&String(x.sana).slice(0,7)!==oy)return;
      var k=(KNOM[x.kassa]||x.kassa)+" → "+(KNOM[x.kassaTo]||x.kassaTo);
      g[k]=(g[k]||0)+n(x.summa); j+=n(x.summa);
    });
    return {lst:Object.keys(g).map(function(k){return{n:k,v:g[k]}}).sort(function(a,b2){return b2.v-a.v}),jami:j};
  }
  m.draw={joriy:drawOy(joriyOy),otgan:drawOy(otganOy),hammasi:drawOy(null)};
  m.drawRoyxat=Y.filter(function(x){return x.tur==="transfer"}).slice(-40).reverse();

  m.oxirgi=Y.length?Y.map(function(x){return x.sana}).sort().slice(-1)[0]:null;
  return m;
}

/* ═════ TAVSIYA ═════ */
function tavsiya(m){
  var r=[];function a(w,t,x,y){r.push({w:w,t:t,x:x,y:y})}
  m.kech.forEach(function(o){a(100,"Kechikkan",o.kim+" — "+(-kunTo(o.sana))+" kun kechikdi, "+fmt(o.qoldiq)+" so'm.",
    o.tur==="Huquq"?"Litsenziya riski. Bugun to'lang yoki yozma sana bering.":"Bugun aloqaga chiqib yangi sana bering.")});
  var roy=m.ob.filter(function(o){return o.tur==="Huquq"})[0];
  if(roy&&kunTo(roy.sana)>=0&&kunTo(roy.sana)<=14)a(95,"Huquq","Royalty "+fmt(roy.qoldiq)+" so'm — "+kunTo(roy.sana)+" kun.","Boshqa to'lovlardan oldin shu.");
  var nol=-1;for(var i=1;i<m.hor.length;i++){if(m.hor[i].K<0){nol=i;break}}
  if(nol>0)a(92,"Kassa","Karta "+nol+" kunda nolga tushadi.","Qaysi to'lovni surasiz yoki qaysi kirimni tezlashtirasiz?");
  if(m.taqchillik<0)a(90,"Kassa","45 kunda "+mln(-m.taqchillik)+" mln yetishmaydi.","Bugun bitta qaror kerak.");
  if(m.muzlagan>50e6)a(75,"Muzlagan pul",mln(m.muzlagan)+" mln tugallanmagan kitoblarda.","Bittasini tugatish eng yuqori qaytimli ish.");
  if(m.qarz.temp&&m.qarz.temp>m.qarz.oylik+1)a(70,"Qarz","Kerakli temp "+fmt(m.qarz.temp)+"$/oy, to'layapsiz "+fmt(m.qarz.oylik)+"$.","Keyingi tirajdan katta to'lov qo'shing.");
  if(!m.oxirgi||kunTo(m.oxirgi)<-2)a(60,"Ma'lumot","Ikki kundan ko'p yozuv kirmagan.","Botga bir qator yozing.");
  if(m.sport7===0)a(45,"Sog'liq","Bu haftada mashg'ulot yo'q.","20 daqiqa yurish ham hisoblanadi.");
  if(m.bomdod7<=4&&(D.Soglik||[]).length>=3)a(50,"Iymon","Oxirgi 7 kunda bomdod "+m.bomdod7+"/7.","Sabab yotish vaqti.");
  if(!r.length)a(10,"Toza","Kechikkan to'lov yo'q.","Maqsad bo'limidan navbatdagi ishni oling.");
  return r.sort(function(x,y){return y.w-x.w});
}

/* ═════ EKRANLAR ═════ */
function ekranBugun(m){
  var h="";
  var kurs=0,kursDiff=0;
  (D.Sozlama||[]).forEach(function(r){
    if(String(r.kalit)==="usd")kurs=n(r.qiymat);
    if(String(r.kalit)==="usd_diff")kursDiff=n(r.qiymat);
  });
  h+='<div class="card"><div class="lbl"><span>Kassa qoldig\'i</span>'
    +(kurs?'<b style="color:'+(kursDiff>0?c("coral"):kursDiff<0?c("mint"):c("mute"))+'">1 USD = '+fmt(kurs)
      +(kursDiff>0?' \u25b2':kursDiff<0?' \u25bc':'')+'</b>':'')+'</div>'
    +'<div class="big" style="color:'+(m.kassa<20e6?c("coral"):c("mint"))+'">'+fmt(m.kassa)+'</div>'
    +(kurs?'<div style="font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:5px">\u2248 $'+fmt(m.kassa/kurs)+'</div>':'')
    +'<div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap">';
  KAS.forEach(function(k){
    h+='<div style="flex:1 1 108px;background:var(--card2);border-radius:14px;padding:10px 11px">'
      +'<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">'
      +ico(k==="Karta"?"Tarqatuvchi":k==="Hisob"?"Bosmaxona":"Xodim",KCOL[k],13)
      +'<span style="font-size:9px;color:var(--mute)">'+KNOM[k]+'</span></div>'
      +'<div style="font-family:var(--mono);font-size:16px;font-weight:700;color:'+KCOL[k]+'">'+fmt(m.kas[k])+'</div></div>';
  });

function ekranKirit(m){
  var kats=CATS.slice();
  (D.Kategoriya||[]).forEach(function(r){if(r.nom&&kats.indexOf(r.nom)<0)kats.push(r.nom)});

  /* tez-tez ishlatilganlar */
  var tez={};
  (D.Yozuv||[]).slice(-60).forEach(function(x){
    if(x.tur!=="chiqim"||!x.cat)return;
    var k=x.cat+"|"+x.kassa+"|"+n(x.summa);
    tez[k]=(tez[k]||0)+1;
  });
  var tezLst=Object.keys(tez).map(function(k){var p=k.split("|");
    return{cat:p[0],kassa:p[1],sum:n(p[2]),soni:tez[k]}})

/* Kategoriya guruhi — Kategoriya varag'idan */
function guruhOl(cat){
  if(SHAX.indexOf(cat)>=0)return "Shaxsiy";
  if(NASHR.indexOf(cat)>=0)return "Nashriyot";
  var g="";
  (D.Kategoriya||[]).forEach(function(r){
    if(r.nom&&String(r.nom).toLowerCase().replace(/['\u2018\u2019]/g,"")===String(cat).toLowerCase().replace(/['\u2018\u2019]/g,""))
      g=String(r.guruh||"").trim();
  });
  return g;
}
function drawKerakP(cat,kassa){
  var g=guruhOl(cat);
  if(g==="Shaxsiy"&&(kassa==="Karta"||kassa==="Hisob"))return "Shaxsiy";
  if(g==="Nashriyot"&&kassa==="Shaxsiy")return "Karta";
  return null;
}

/* Chiqimni draw bilan yozish */
function chiqimYoz(cat,kassa,sum,izoh){
  var dw=drawKerakP(cat,kassa);
  belgi("saqlanyapti…");
  var zanjir=Promise.resolve();
  if(dw){
    zanjir=api({amal:"qosh",varaq:"Yozuv",obj:JSON.stringify({sana:bugun(),tur:"transfer",
      kassa:kassa,kassaTo:dw,summa:sum,cat:"",objId:"",izoh:"draw · "+cat})})
      .then(function(j){if(j.ok){if(!D.Yozuv)D.Yozuv=[];D.Yozuv.push(j.obj)}});
    kassa=dw;
  }
  return zanjir.then(function(){
    return api({amal:"qosh",varaq:"Yozuv",obj:JSON.stringify({sana:bugun(),tur:"chiqim",
      kassa:kassa,kassaTo:"",summa:sum,cat:cat,objId:"",izoh:izoh||""})});
  }).then(function(j){
    if(j.ok){D.Yozuv.push(j.obj);belgi(dw?"saqlandi · draw":"saqlandi");render()}
    else belgi("xato: "+j.xato);
  }).catch(function(){belgi("ulanmadi")});
}

function kiritRaqam(d){
  if(d==="←"){KI.sum=Math.floor(KI.sum/10)}
  else if(d==="000"){KI.sum=KI.sum*1000}
  else{KI.sum=KI.sum*10+Number(d)}
  if(KI.sum>1e12)KI.sum=1e12;
  render();
}

function qoldiqSet(k,t){

function majburiyatTakrorSaqla(){
  var kim=(document.getElementById("fMajKim").value||"").trim();
  var summa=Number(document.getElementById("fMajSumma").value)||0;
  var kunlar=(document.getElementById("fMajKunlar").value||"").split(",")
    .map(function(x){return parseInt(x.trim())}).filter(function(x){return x>=1&&x<=28});
  var oySoni=Number(document.getElementById("fMajOy").value)||6;
  var tur=document.getElementById("fMajTur").value;
  var manba=document.getElementById("fMajManba").value;
  if(!kim||!summa||!kunlar.length){belgi("nom, summa va kunlarni to'ldiring");return}

  var royxat=[];
  var bugunD=new Date(bugun());
  for(var o=0;o<oySoni;o++){
    kunlar.forEach(function(kun){
      var d=new Date(bugunD.getFullYear(),bugunD.getMonth()+o,kun);
      if(d<bugunD)return;
      var sana=d.toISOString().slice(0,10);
      royxat.push({kim:kim+" · "+sana.slice(8,10)+"."+sana.slice(5,7),summa:summa,sana:sana,
        tur:tur,manba:manba,tolangan:0,paid:false});
    });
  }
  if(!royxat.length){belgi("bironta sana topilmadi");return}

  belgi("saqlanyapti… 0/"+royxat.length);
  var i=0;
  function keyingi(){
    if(i>=royxat.length){ MODAL=null; belgi("yaratildi: "+royxat.length+" ta"); render(); return; }
    var o=royxat[i++];
    api({amal:"qosh",varaq:"Majburiyat",obj:JSON.stringify(o)}).then(function(j){
      if(j.ok){ if(!D.Majburiyat)D.Majburiyat=[]; D.Majburiyat.push(j.obj); }
      belgi("saqlanyapti… "+i+"/"+royxat.length);
      keyingi();
    }).catch(function(){ keyingi(); });
  }
  keyingi();
}

    if(!g.lst.length)return '<p style="font-size:12px;color:var(--dim);text-align:center;padding:20px 0">Bu oyda yozuv yo\'q</p>';
    var q='<div style="background:var(--card2);border-radius:12px;padding:12px;margin-bottom:12px;text-align:center">'
      +'<div style="font-family:var(--mono);font-size:24px;font-weight:700;color:'+rang+'">'+fmt(g.jami)+'</div></div>';
    g.lst.forEach(function(x,i){
      var col=PALITRA[i%PALITRA.length];
      q+='<div style="padding:10px 0;border-bottom:1px solid var(--card2)">'
        +'<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:5px">'
        +'<span style="font-size:12.5px">'+esc(x.n)+'</span>'
        +'<span style="font-family:var(--mono);font-size:12.5px;color:'+col+'">'+fmt(x.v)+'</span></div>'
        +'<div class="bar" style="height:5px"><div style="width:'+(x.v/Math.max(1,g.jami)*100)+'%;background:'+col+'"></div></div>'
        +'<div style="font-family:var(--mono);font-size:8.5px;color:var(--dim);margin-top:3px">'
        +Math.round(x.v/Math.max(1,g.jami)*100)+'%</div></div>';
    });
    return q;
  }

  function oyJadval(joriy,otgan,rang){
    var q='<div style="display:flex;gap:8px;margin-bottom:12px">'
      +'<div style="flex:1;background:var(--card2);border-radius:12px;padding:11px">'
      +'<div style="font-size:9px;color:var(--mute)">Bu oy</div>'
      +'<div style="font-family:var(--mono);font-size:17px;font-weight:700;color:'+rang+'">'+mln(joriy.jami)+'</div></div>'
      +'<div style="flex:1;background:var(--card2);border-radius:12px;padding:11px">'
      +'<div style="font-size:9px;color:var(--mute)">O\'tgan oy</div>'
      +'<div style="font-family:var(--mono);font-size:17px;font-weight:700;color:var(--dim)">'+mln(otgan.jami)+'</div></div></div>';
    var barcha={};
    joriy.lst.forEach(function(x){barcha[x.n]={j:x.v,o:0}});
    otgan.lst.forEach(function(x){if(barcha[x.n])barcha[x.n].o=x.v;else barcha[x.n]={j:0,o:x.v}});
    var lst=Object.keys(barcha).map(function(k){return{n:k,j:barcha[k].j,o:barcha[k].o}})
      .sort(function(a,b2){return (b2.j+b2.o)-(a.j+a.o)});
    var mx=Math.max(1,joriy.jami,otgan.jami);
    lst.forEach(function(x,i){
      var col=PALITRA[i%PALITRA.length];
      var farq=x.o?Math.round((x.j-x.o)/x.o*100):null;
      q+='<div style="padding:10px 0;border-bottom:1px solid var(--card2)">'
        +'<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:5px">'
        +'<span style="font-size:12.5px">'+esc(x.n)+'</span>'
        +'<span style="font-family:var(--mono);font-size:12.5px;color:'+col+'">'+fmt(x.j)+'</span></div>'
        +'<div class="bar" style="height:5px;margin-bottom:3px"><div style="width:'+(x.j/mx*100)+'%;background:'+col+'"></div></div>'
        +'<div class="bar" style="height:3px"><div style="width:'+(x.o/mx*100)+'%;background:var(--card3)"></div></div>'
        +'<div style="font-family:var(--mono);font-size:8.5px;color:var(--dim);margin-top:4px">o\'tgan oy '+fmt(x.o)
        +(farq!==null&&farq!==0?' · '+(farq>0?"+":"")+farq+'%':'')+'</div></div>';
    });
    return q;
  }

  if(MODAL==="kirimDetal"){
    t="Kirim manbalari";
    h+=oyBoshi()+oyRoyxat(m.oyGuruh("kirim",oyKey(MOY)),c("mint"));
  }
  if(MODAL==="chiqimDetal"){
    t="Xarajat manbalari";
    h+=oyBoshi()+oyRoyxat(m.oyGuruh("chiqim",oyKey(MOY)),c("coral"));
  }
  if(MODAL&&MODAL.indexOf("kir_")===0){
    var kk=MODAL.slice(4);
    t="Kirim · "+(KNOM[kk]||kk);
    h+=oyBoshi()+oyRoyxat(m.oyGuruh("kirim",oyKey(MOY),function(x){return x.kassa===kk}),KCOL[kk]||c("mint"));
  }
  if(MODAL&&MODAL.indexOf("guruh_")===0){
    var gr=MODAL.slice(6);
    t=gr==="Shaxsiy"?"Ro'zg'or xarajatlari":"Nashriyot xarajatlari";
    h+=oyBoshi()+oyRoyxat(m.oyGuruh("chiqim",oyKey(MOY),function(x){return m.guruhNomi(x.cat)===gr}),
      gr==="Shaxsiy"?c("lav"):c("amber"));
  }
  if(MODAL==="draw"){
    t="Hisoblararo o'tkazma";
    h+='<p style="font-size:11px;color:var(--dim);line-height:1.5;margin:0 0 12px">'
      +'Nashriyot puli ro\'zg\'orga yoki shaxsiy pul nashriyotga o\'tganda yoziladi.</p>';
    var dg={},dj=0;
    (D.Yozuv||[]).forEach(function(x){
      if(x.tur!=="transfer")return;
      if(String(x.sana).slice(0,7)!==oyKey(MOY))return;
      var k=(KNOM[x.kassa]||x.kassa)+" → "+(KNOM[x.kassaTo]||x.kassaTo);
      dg[k]=(dg[k]||0)+n(x.summa); dj+=n(x.summa);
    });
    h+=oyBoshi()+oyRoyxat({lst:Object.keys(dg).map(function(k){return{n:k,v:dg[k]}})
      .sort(function(a,b2){return b2.v-a.v}),jami:dj},c("lav"));
    var drOy=m.drawRoyxat.filter(function(x){return String(x.sana).slice(0,7)===oyKey(MOY)});
    if(drOy.length){
      h+='<div class="lbl" style="margin-top:16px"><span>'+oyNom(MOY)+' oyidagi o\'tkazmalar</span></div>';
      drOy.slice(0,30).forEach(function(x){
        h+='<div class="row"><span style="font-family:var(--mono);font-size:9.5px;color:var(--dim);min-width:34px">'
          +String(x.sana).slice(5,10)+'</span>'
          +'<span style="flex:1;font-size:11px;color:var(--mute)">'+(KNOM[x.kassa]||x.kassa)+' → '+(KNOM[x.kassaTo]||x.kassaTo)
          +(x.izoh?' · '+esc(String(x.izoh).replace("draw · ","")):'')+'</span>'
          +'<span style="font-family:var(--mono);font-size:11px;color:'+c("lav")+'">'+fmt(x.summa)+'</span></div>';
      });
    }
  }
  if(MODAL==="katYangi"){
    t="Yangi kategoriya";
    h+='<label class="f">Nomi</label><input id="fKatNom" placeholder="masalan: Kir yuvish" style="margin-bottom:12px">'
      +'<label class="f">Guruh</label><div class="acc" style="margin-bottom:14px">'
      +'<button id="fKatG_Shaxsiy" onclick="fKatGuruh(\'Shaxsiy\')" style="background:var(--card3);color:'+c("lav")+'">Shaxsiy</button>'
      +'<button id="fKatG_Nashriyot" onclick="fKatGuruh(\'Nashriyot\')" style="background:var(--card2);color:var(--mute)">Nashriyot</button>'
      +'</div>'
      +'<button class="btn" onclick="kategoriyaSaqla()">Yaratish</button>';
  }

  if(MODAL==="majburiyatYangi"){
    t="Yangi majburiyat";
    h+='<div class="pill">'
      +'<button class="'+(FMAJ_REJIM==="bir"?"on":"")+'" onclick="FMAJ_REJIM=\'bir\';render()">Bir martalik</button>'
      +'<button class="'+(FMAJ_REJIM==="takror"?"on":"")+'" onclick="FMAJ_REJIM=\'takror\';render()">Har oy takror</button>'
      +'</div>';
    h+='<div class="grid" style="margin-bottom:10px">'
      +'<div style="grid-column:1/-1"><label class="f">Nomi</label><input id="fMajKim" placeholder="masalan: Bosmaxona — yangi qarz"></div>'
      +'<div><label class="f">Summa, so\'m</label><input id="fMajSumma" inputmode="numeric" placeholder="0"></div>';
    if(FMAJ_REJIM==="bir"){
      h+='<div><label class="f">Muddat</label><input id="fMajSana" type="date" value="'+bugun()+'"></div>';
    } else {
      h+='<div><label class="f">Har oyning kunlari</label><input id="fMajKunlar" placeholder="masalan: 5, 20" value="5, 20"></div>'
        +'<div><label class="f">Necha oy davomida</label><input id="fMajOy" inputmode="numeric" value="6"></div>';
    }
    h+='<div><label class="f">Turi</label><select id="fMajTur">'
      +["Huquq","Ishlab chiqarish","Jamoa","Shaxsiy qarz","Boshqa"].map(function(x){return '<option>'+x+'</option>'}).join("")
      +'</select></div>'
      +'<div><label class="f">Qaysi hisobdan</label><select id="fMajManba">'
      +KAS.map(function(k){return '<option value="'+k+'">'+KNOM[k]+'</option>'}).join("")
      +'</select></div></div>';
    if(FMAJ_REJIM==="takror")
      h+='<p style="font-size:10.5px;color:var(--dim);line-height:1.5;margin:0 0 12px">Har oyning belgilangan kunlarida alohida majburiyat yaratiladi. Masalan "5, 20" va 6 oy — 12 ta to\'lov.</p>';
    h+='<button class="btn" onclick="'+(FMAJ_REJIM==="takror"?"majburiyatTakrorSaqla()":"majburiyatSaqla()")+'">Yaratish</button>';
  }

  if(MODAL==="kitobYangi"||(MODAL&&MODAL.indexOf("kitob_")===0)){
    var tahrirId=MODAL.indexOf("kitob_")===0?MODAL.slice(6):null;
    var bk=tahrirId?m.kitob.filter(function(x){return x.id===tahrirId})[0]:null;
    var bkXom=tahrirId?(D.Kitob||[]).filter(function(x){return x.id===tahrirId})[0]:null;
    t=tahrirId?("Tahrirlash · "+(bk?bk.nom:"")):"Yangi kitob";
    function fq(lbl,id,val,ph){
      return '<div><label class="f">'+lbl+'</label><input id="'+id+'" inputmode="numeric" placeholder="'+(ph||"0")+'" value="'+(val!==undefined&&val!==null&&val!==""?val:"")+'"></div>';
    }
    if(!tahrirId){
      h+='<label class="f">Kitob nomi</label><input id="fKNom" placeholder="masalan: Yangi roman" style="margin-bottom:12px">';
    } else {
      h+='<input type="hidden" id="fKId" value="'+tahrirId+'">';
    }
    h+='<div class="lbl" style="margin-top:4px"><span>Xarajatlar</span></div><div class="grid" style="margin-bottom:10px">'
      +fq("Mualliflik huquqi","fK_huquq",bkXom?bkXom.huquq:"")
      +fq("Tarjima","fK_tarjima",bkXom?bkXom.tarjima:"")
      +fq("Tahrir","fK_tahrir",bkXom?bkXom.tahrir:"")
      +fq("Korrektura","fK_korrektura",bkXom?bkXom.korrektura:"")
      +fq("Dizayn","fK_dizayn",bkXom?bkXom.dizayn:"")
      +fq("SMM","fK_smm",bkXom?bkXom.smm:"")
      +'</div>'
      +'<div class="lbl"><span>Sotuv</span></div><div class="grid" style="margin-bottom:10px">'
      +fq("Retail narx","fK_retail",bkXom?bkXom.retail:"")
      +fq("Ulgurji narx","fK_dist",bkXom?bkXom.dist:"")
      +fq("Tiraj (jami)","fK_tiraj",bkXom?bkXom.tiraj:"")
      +fq("Qoldiq (nusxa)","fK_qoldiq",bkXom?bkXom.qoldiq:"")
      +fq("Chop narxi/dona","fK_chopDona",bkXom?bkXom.chopDona:"")
      +'<div><label class="f">Royalty, %</label><input id="fK_foiz" inputmode="numeric" value="'
      +(bkXom&&bkXom.foiz!==undefined&&bkXom.foiz!==""?bkXom.foiz:"8")+'"></div>'
      +'</div>'
      +'<div class="lbl"><span>Holat</span></div>'
      +'<select id="fK_holat" style="margin-bottom:10px">'
      +["Ishlab chiqarishda","Tayyor","Savdoda"].map(function(x){return '<option'+(bkXom&&bkXom.holat===x?" selected":"")+'>'+x+'</option>'}).join("")
      +'</select>'
      +'<label class="f">Izoh</label><input id="fK_izoh" value="'+esc(bkXom?bkXom.izoh||"":"")+'" style="margin-bottom:14px">'
      +'<button class="btn" onclick="'+(tahrirId?"kitobTahrirSaqla()":"kitobYangiSaqla()")+'">'+(tahrirId?"Saqlash":"Yaratish")+'</button>';
  }

  if(MODAL==="muzlagan"){
    t="Muzlagan kapital";
    var lst2=m.kitob.filter(function(b){return b.holat!=="Savdoda"})
      .map(function(b){return{nom:b.nom,holat:b.holat,izoh:b.izoh,sarf:b.pre-b.qoldiqTolov,pre:b.pre,qarz:b.qoldiqTolov}})
      .filter(function(x){return x.sarf>0}).sort(function(a,b2){return b2.sarf-a.sarf});
    h+='<div class="lbl"><span>Tugallanmagan kitoblarda</span><b>'+mln(m.muzlagan)+' mln</b></div>'
      +'<p style="font-size:11px;color:var(--dim);line-height:1.5;margin:0 0 12px">Sarflangan, lekin hali savdoga chiqmagan pul.</p>';
    lst2.forEach(function(x,i){
      var col=PALITRA[i%PALITRA.length];
      h+='<div style="padding:11px 0;border-bottom:1px solid var(--card2)">'
        +'<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:4px">'
        +'<span style="font-family:var(--disp);font-size:14.5px">'+esc(x.nom)+'</span>'
        +'<span style="font-family:var(--mono);font-size:13px;color:'+col+'">'+fmt(x.sarf)+'</span></div>'
        +'<div class="bar" style="height:5px"><div style="width:'+(x.sarf/m.muzlagan*100)+'%;background:'+col+'"></div></div>'
        +'<div style="font-size:9.5px;color:var(--dim);margin-top:4px">'+esc(x.holat||"")
        +(x.qarz?' · to\'lanmagan '+fmt(x.qarz):'')+'</div></div>';
    });
    h+='<div style="margin-top:12px;background:var(--card2);border-radius:12px;padding:12px;font-size:11.5px;line-height:1.5;color:var(--mute)">'
      +'Bu pul chop etilgunicha qaytmaydi. Bitta kitobni tugatish yangisini boshlashdan foydaliroq.</div>';
  }
  if(MODAL==="royalty"){
    t="Royalty";
    var rl=m.kitob.filter(function(b){return b.roy>0||b.foiz>0})
      .map(function(b){return{nom:b.nom,foiz:b.foiz,tus:b.tus,roy:b.roy,sot:b.sot,tirajlar:b.tirajlar}})
      .sort(function(a,b2){return b2.roy-a.roy});
    var jamiR=rl.reduce(function(a,x){return a+x.roy},0);
    h+='<div class="lbl"><span>Kitob bo\'yicha</span><b>'+mln(jamiR)+' mln</b></div>';
    rl.forEach(function(x,i){
      if(!x.roy){
        h+='<div style="padding:9px 0;border-bottom:1px solid var(--card2);display:flex;justify-content:space-between">'
          +'<span style="font-family:var(--disp);font-size:14px">'+esc(x.nom)+'</span>'
          +'<span style="font-family:var(--mono);font-size:11px;color:'+c("mint")+'">royalty yo\'q</span></div>';
        return;
      }
      var col=PALITRA[i%PALITRA.length];
      h+='<div style="padding:11px 0;border-bottom:1px solid var(--card2)">'
        +'<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:4px">'
        +'<span style="font-family:var(--disp);font-size:14.5px">'+esc(x.nom)+'</span>'
        +'<span style="font-family:var(--mono);font-size:13px;color:'+col+'">'+fmt(x.roy)+'</span></div>'
        +'<div style="font-family:var(--mono);font-size:9.5px;color:var(--dim)">'
        +fmt(x.sot)+' nusxa · tushum '+mln(x.tus)+' mln · '+x.foiz+'%</div></div>';
    });
    /* huquq majburiyatlari */
    var hq=m.ob.filter(function(o){return o.tur==="Huquq"||/royalty|muallif/i.test(o.kim)});
    if(hq.length){
      h+='<div class="lbl" style="margin-top:16px"><span>To\'lov majburiyatlari</span></div>';
      hq.sort(function(a,b2){return new Date(a.sana)-new Date(b2.sana)}).forEach(function(o){
        var dd=kunTo(o.sana);
        h+='<div style="padding:10px 0;border-bottom:1px solid var(--card2)">'
          +'<div style="display:flex;justify-content:space-between;gap:8px">'
          +'<span style="font-size:12.5px">'+esc(o.kim)+'</span>'
          +'<span style="font-family:var(--mono);font-size:12.5px;color:'+(dd<0?c("coral"):c("amber"))+'">'+fmt(o.qoldiq)+'</span></div>'
          +'<div style="font-family:var(--mono);font-size:9px;color:'+(dd<0?c("coral"):c("dim"))+';margin-top:3px">'
          +o.sana+' · '+(dd<0?(-dd)+" kun kechikdi":dd+" kun")
          +(o.tol?' · to\'langan '+fmt(o.tol):'')+'</div></div>';
      });
    }
    h+='<div style="margin-top:12px;background:var(--card2);border-radius:12px;padding:12px;font-size:11.5px;line-height:1.5;color:var(--mute)">'
      +'Royalty sotilgan nusxadan hisoblanadi. Tarqatuvchi to\'lamagan nusxalar uchun pul hali kelmagan — '
      +'lekin muallif oldidagi majburiyat allaqachon yuzaga kelgan.</div>';
  }
  if(MODAL==="ombor"){
    t="Tarqatuvchidagi ombor";
    var lst=m.kitob.filter(function(b){return b.qoldiq>0&&b.dist>0})
      .map(function(b){return{nom:b.nom,soni:b.qoldiq,narx:b.dist,summa:b.qoldiq*b.dist}})
      .sort(function(a,b2){return b2.summa-a.summa});
    h+='<div class="lbl"><span>Sotilmagan nusxalar</span><b>'+mln(m.ombor)+' mln</b></div>';
    lst.forEach(function(x,i){
      var col=PALITRA[i%PALITRA.length];
      h+='<div style="padding:10px 0;border-bottom:1px solid var(--card2)">'
        +'<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:5px">'
        +'<span style="font-family:var(--disp);font-size:14px">'+esc(x.nom)+'</span>'
        +'<span style="font-family:var(--mono);font-size:13px;color:'+col+'">'+fmt(x.summa)+'</span></div>'
        +'<div class="bar" style="height:5px"><div style="width:'+(x.summa/m.ombor*100)+'%;background:'+col+'"></div></div>'
        +'<div style="font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:4px">'
        +fmt(x.soni)+' nusxa \u00d7 '+fmt(x.narx)+'</div></div>';
    });
  }
  return '<div class="ovl" onclick="modalYop()"><div class="sheet" onclick="event.stopPropagation()">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    +'<span style="font-family:var(--disp);font-size:19px">'+t+'</span>'
    +'<button class="btn2" style="padding:7px 13px" onclick="modalYop()">Yopish</button></div>'+h+'</div></div>';
}
function qator(nom,izoh,summa,col){
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--card2)">'
    +'<div><div style="font-size:12px">'+nom+'</div>'
    +(izoh?'<div style="font-size:9px;color:var(--dim);margin-top:2px">'+izoh+'</div>':'')+'</div>'
    +'<span style="font-family:var(--mono);font-size:12.5px;color:'+col+';white-space:nowrap">'
    +(summa<0?"\u2212":"+")+fmt(Math.abs(summa))+'</span></div>';
}

function xatoKor(e){
  document.getElementById("app").innerHTML='<div class="card"><div class="lbl"><span>Xato</span></div>'
    +'<p style="font-size:12px;color:'+c("coral")+';line-height:1.5">'+esc(String(e))+'</p>'
    +'<button class="btn" style="margin-top:10px" onclick="qayta()">Qayta urinish</button></div>';
}
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}}catch(e){}
yukla().then(render).catch(xatoKor);
</script>
