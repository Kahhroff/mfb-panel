<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MFB · Mening hayotim</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#08161D; --card:#102630; --card2:#16333F; --card3:#1D4150; --line:#204450;
  --txt:#EAF2EF; --mute:#7C9BA3; --dim:#56737C;
  --mint:#5FD3A6; --sky:#6FB6DA; --amber:#F0BE55; --coral:#E8785B; --lav:#A99BE0; --rose:#D96D8E;
  --mono:ui-monospace,'SF Mono','Roboto Mono',Menlo,monospace;
  --disp:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:12px 11px 70px;max-width:640px;margin:0 auto}
h1{font-family:var(--disp);font-size:20px;font-weight:400;margin:1px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:10px}
.brand{font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase}
.meta{font-family:var(--mono);font-size:8.5px;color:var(--dim);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:9px;font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.lbl b{color:var(--amber);font-weight:400}
.kpi{background:var(--card2);border-radius:9px;padding:9px 10px}
.kpi .k{font-size:9px;color:var(--mute)}
.kpi .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:3px;line-height:1}
.kpi .s{font-size:8.5px;color:var(--dim);margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px}
button{font-family:var(--mono);cursor:pointer;border:none;border-radius:8px}
.btn{background:var(--amber);color:var(--bg);padding:10px 14px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;width:100%}
.btn2{background:var(--card2);color:var(--mute);padding:8px 12px;font-size:9.5px;text-transform:uppercase}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:7px 9px;font-family:var(--mono);font-size:12.5px;width:100%;outline:none;border-radius:7px;-webkit-appearance:none}
label.f{font-size:9px;color:var(--mute);display:block;margin-bottom:3px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;max-width:640px;margin:0 auto}
nav button{flex:1;background:none;border-radius:0;padding:10px 1px 14px;color:var(--dim);font-size:8.5px;border-top:2px solid transparent}
nav button.on{color:var(--amber);font-weight:700;border-top-color:var(--amber)}
.row{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--card2);font-size:11.5px}
.tag{border:none;border-radius:5px;padding:3px 6px;font-family:var(--mono);font-size:8px;font-weight:700;color:var(--bg);flex-shrink:0}
.pill{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:10px;border:1px solid var(--line);margin-bottom:9px}
.pill button{flex:1;background:none;color:var(--mute);padding:8px 4px;font-size:10px;text-transform:uppercase}
.pill button.on{background:var(--card3);color:var(--amber);font-weight:700}
.ico{width:26px;height:26px;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px;margin-bottom:9px}
.catgrid button{background:var(--card2);border:1px solid transparent;border-radius:9px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:7.5px;line-height:1.1;text-align:center}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.chips button{flex:1 1 50px;background:var(--card2);color:var(--txt);padding:8px 2px;font-size:10px}
.acc{display:flex;gap:5px}
.acc button{flex:1;background:var(--card2);color:var(--mute);padding:10px 3px;font-size:10px}
.warn{padding:9px 10px;background:var(--bg);border-radius:8px;border-left:3px solid var(--coral);font-size:11px;color:var(--coral);line-height:1.45;margin-top:8px}
.hl{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:82px}
.hl span.n{font-size:8px;color:var(--mute);text-align:center;line-height:1.15;max-width:88px}
.hl span.v{font-family:var(--mono);font-size:7.5px;color:var(--dim)}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dr{stroke-dasharray:1400;animation:dr 1.1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes dr{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.load{text-align:center;padding:60px 20px;color:var(--mute);font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<div id="app"><div class="load">Yuklanyapti…</div></div>
<nav id="nav"></nav>

<script>
/* ═══════════ SOZLAMA ═══════════ */
var API = "https://script.google.com/macros/s/AKfycby0AbDC_RZEFG_Six9rwGsWrRlHDWM1hF5ykd_cU12F1SOGsJ9TVY_nLCNCB7sfOu7_/exec";
var MAXFIY = "ram5657";

/* ═══════════ YORDAMCHILAR ═══════════ */
var D = null, tab = "bugun", holat = "";
var CATS = ["Korzinka","Kommunal","Ayolimga","Qizim","Ota-ona","Transport","Sog'liq","Sadaqa","Qarz to'lovi","Bosmaxona","Tarjimon","Tahrir","Royalty","SMM","Xodim","Zaxira","Boshqa"];
var SHAX = ["Korzinka","Kommunal","Ayolimga","Qizim","Ota-ona","Transport","Sog'liq","Sadaqa"];
var NASHR = ["Bosmaxona","Tarjimon","Tahrir","Royalty","SMM","Xodim"];
var KAS = ["Karta","Hisob","Shaxsiy"];
var KCOL = {Karta:"var(--sky)",Hisob:"var(--amber)",Shaxsiy:"var(--lav)"};
var KNOM = {Karta:"Karta",Hisob:"Hisob raqam",Shaxsiy:"Shaxsiy"};
var CCOL = {Korzinka:"var(--mint)",Kommunal:"var(--sky)",Ayolimga:"var(--rose)",Qizim:"var(--lav)","Ota-ona":"var(--lav)",Transport:"var(--dim)","Sog'liq":"var(--coral)",Sadaqa:"var(--mint)","Qarz to'lovi":"var(--sky)",Bosmaxona:"var(--amber)",Tarjimon:"var(--amber)",Tahrir:"var(--amber)",Royalty:"var(--coral)",SMM:"var(--amber)",Xodim:"var(--amber)",Zaxira:"var(--mint)",Boshqa:"var(--dim)"};

function n(v){var x=Number(v);return isNaN(x)?0:x}
function fmt(v){return isNaN(v)||v===null?"—":Math.round(v).toLocaleString("ru-RU").replace(/,/g," ")}
function mln(v){return isNaN(v)||v===null?"—":(v/1e6).toFixed(1)}
function bugun(){var d=new Date(Date.now()+5*3600000);return d.toISOString().slice(0,10)}
function kunTo(s){var t=new Date(s).getTime();return isNaN(t)?999:Math.round((t-new Date(bugun()).getTime())/864e5)}
function dOff(i){return new Date(new Date(bugun()).getTime()+i*864e5).toISOString().slice(0,10)}
function tr(v){return v===true||v==="TRUE"||v==="true"||v===1}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

var ICO = {
 Korzinka:'<path d="M3 7h18l-2 12H5L3 7z"/><path d="M8 7V4a4 4 0 018 0v3"/>',
 Kommunal:'<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>',
 Ayolimga:'<circle cx="12" cy="7" r="4"/><path d="M12 11v7M9 21h6M9 15h6"/>',
 Qizim:'<circle cx="12" cy="8" r="3.5"/><path d="M6 21c0-4 2.7-6.5 6-6.5s6 2.5 6 6.5"/>',
 "Ota-ona":'<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M3 20c0-3 2.2-5 5-5M21 20c0-3-2.2-5-5-5"/>',
 Transport:'<path d="M4 15l2-6h12l2 6M3 15h18v4H3v-4z"/><circle cx="7" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/>',
 "Sog'liq":'<path d="M12 20s-7-4.5-7-9.5A4 4 0 0112 8a4 4 0 017 2.5c0 5-7 9.5-7 9.5z"/>',
 Sadaqa:'<path d="M4 13c2-3 5-3 8 0l4 4M4 13v6h13M17 10l3-3"/>',
 "Qarz to'lovi":'<path d="M3 12h14M13 7l5 5-5 5"/>',
 Bosmaxona:'<path d="M7 8V3h10v5M7 18v3h10v-3"/><rect x="3" y="8" width="18" height="10" rx="2"/>',
 Tarjimon:'<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/>',
 Tahrir:'<path d="M5 19h14M8 15l9-9 3 3-9 9H8v-3z"/>',
 Royalty:'<path d="M4 8l4 4 4-8 4 8 4-4v11H4V8z"/>',
 SMM:'<path d="M4 10v4h3l6 4V6l-6 4H4zM17 9a4 4 0 010 6"/>',
 Xodim:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M17 8h4M19 6v4"/>',
 Zaxira:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>',
 Kirim:'<path d="M12 20V5M7 10l5-5 5 5"/>',
 Tarqatuvchi:'<rect x="3" y="9" width="12" height="8" rx="1"/><path d="M15 12h3l3 3v2h-6"/><circle cx="7" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
 Boshqa:'<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>'
};
function ico(nom,col,sz){
  var p=ICO[nom]||ICO.Boshqa;
  return '<svg width="'+(sz||15)+'" height="'+(sz||15)+'" viewBox="0 0 24 24" fill="none" stroke="'+(col||"var(--mute)")+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
}

/* ═══════════ SERVER ═══════════ */
function api(p){
  var u = API+"?maxfiy="+encodeURIComponent(MAXFIY);
  for(var k in p) u += "&"+k+"="+encodeURIComponent(p[k]);
  return fetch(u).then(function(r){return r.json()});
}
function yukla(){
  return api({amal:"hammasi"}).then(function(j){
    if(!j.ok) throw new Error(j.xato||"noma'lum");
    D = j.data; return D;
  });
}
function belgi(t){ holat=t; var el=document.getElementById("holat"); if(el) el.textContent=t; if(t) setTimeout(function(){holat="";var e2=document.getElementById("holat");if(e2)e2.textContent=""},1600); }

function qosh(varaq,obj){
  belgi("saqlanyapti…");
  return api({amal:"qosh",varaq:varaq,obj:JSON.stringify(obj)}).then(function(j){
    if(j.ok){ if(!D[varaq])D[varaq]=[]; D[varaq].push(j.obj); belgi("saqlandi"); render(); }
    else belgi("xato: "+j.xato);
  }).catch(function(e){belgi("ulanmadi")});
}
function yangi(varaq,id,maydon,qiymat){
  belgi("saqlanyapti…");
  return api({amal:"yangila",varaq:varaq,id:id,maydon:maydon,qiymat:qiymat}).then(function(j){
    if(j.ok){ D[varaq].forEach(function(x){ if(String(x.id)===String(id)) x[maydon]=qiymat }); belgi("saqlandi"); render(); }
    else belgi("xato");
  }).catch(function(){belgi("ulanmadi")});
}
function ochir(varaq,id){
  belgi("o'chirilyapti…");
  return api({amal:"ochir",varaq:varaq,id:id}).then(function(j){
    if(j.ok){ D[varaq]=D[varaq].filter(function(x){return String(x.id)!==String(id)}); belgi("o'chdi"); render(); }
  }).catch(function(){belgi("ulanmadi")});
}
function kassaBelgila(nom,qiymat){
  belgi("saqlanyapti…");
  return api({amal:"kassa",nom:nom,qiymat:qiymat}).then(function(j){
    if(j.ok){ var bor=false; D.Kassa.forEach(function(x){if(x.nom===nom){x.boshlangich=qiymat;bor=true}});
      if(!bor)D.Kassa.push({nom:nom,boshlangich:qiymat}); belgi("saqlandi"); render(); }
  }).catch(function(){belgi("ulanmadi")});
}

/* ═══════════ HISOB ═══════════ */
function hisob(){
  var Y=D.Yozuv||[], M=D.Majburiyat||[], K=D.Kitob||[], T=D.Tarqatuvchi||[], S=D.Soglik||[], P=D.Prognoz||[];
  var m={};
  function s(tur,k){return Y.filter(function(x){return x.tur===tur&&(k?x.kassa===k:true)}).reduce(function(a,x){return a+n(x.summa)},0)}
  function trIn(k){return Y.filter(function(x){return x.tur==="transfer"&&x.kassaTo===k}).reduce(function(a,x){return a+n(x.summa)},0)}
  function trOut(k){return Y.filter(function(x){return x.tur==="transfer"&&x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)}
  function bosh(k){var r=(D.Kassa||[]).filter(function(x){return x.nom===k})[0];return r?n(r.boshlangich):0}
  m.kas={}; KAS.forEach(function(k){ m.kas[k]=bosh(k)+s("kirim",k)-s("chiqim",k)+trIn(k)-trOut(k) });
  m.kassa = KAS.reduce(function(a,k){return a+m.kas[k]},0);

  var in30=Y.filter(function(x){return kunTo(x.sana)>=-30});
  m.kirim30=in30.filter(function(x){return x.tur==="kirim"}).reduce(function(a,x){return a+n(x.summa)},0);
  m.chiqim30=in30.filter(function(x){return x.tur==="chiqim"}).reduce(function(a,x){return a+n(x.summa)},0);
  m.kirim7=Y.filter(function(x){return kunTo(x.sana)>=-7&&x.tur==="kirim"}).reduce(function(a,x){return a+n(x.summa)},0);

  m.ob = M.filter(function(x){return !tr(x.paid)}).map(function(o){
    var tol=Y.filter(function(x){return x.tur==="chiqim"&&String(x.objId)===String(o.id)});
    var jt=tol.reduce(function(a,x){return a+n(x.summa)},0)+n(o.tolangan);
    return {id:o.id,kim:o.kim,summa:n(o.summa),sana:o.sana,tur:o.tur,manbaK:o.manba||"Karta",
      tol:jt,qoldiq:Math.max(0,n(o.summa)-jt),foiz:n(o.summa)?Math.min(100,jt/n(o.summa)*100):0,
      manba:KAS.map(function(k){return {k:k,v:tol.filter(function(x){return x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)}})};
  });
  m.ob45=m.ob.filter(function(o){return kunTo(o.sana)<=45});
  m.ob45J=m.ob45.reduce(function(a,o){return a+o.qoldiq},0);
  m.kech=m.ob.filter(function(o){return kunTo(o.sana)<0});
  m.kut=(D.Kutilayotgan||[]).filter(function(x){return !tr(x.paid)});
  m.kutJ=m.kut.filter(function(x){return kunTo(x.sana)<=45}).reduce(function(a,x){return a+n(x.summa)},0);
  m.taqchillik=m.kassa+m.kutJ-m.ob45J;
  m.kunlar=m.chiqim30>0?Math.round(m.kassa/(m.chiqim30/30)):null;

  var oy=bugun().slice(0,7);
  m.prg=P.map(function(p){
    var cats=String(p.cats||"").split(",").map(function(x){return x.trim()});
    var sarf=Y.filter(function(x){return x.tur==="chiqim"&&cats.indexOf(x.cat)>=0&&String(x.sana).slice(0,7)===oy});
    var j=sarf.reduce(function(a,x){return a+n(x.summa)},0);
    return {nom:p.nom,summa:n(p.summa),ico:p.ico,sarf:j,foiz:n(p.summa)?j/n(p.summa)*100:0,
      manba:KAS.map(function(k){return {k:k,v:sarf.filter(function(x){return x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)}})};
  });

  var db=T.filter(function(x){return x.tur==="boshlangich"}).reduce(function(a,x){return a+n(x.summa)},0);
  var dt=T.filter(function(x){return x.tur==="tolov"}).reduce(function(a,x){return a+n(x.summa)},0);
  var dy=T.filter(function(x){return x.tur==="yangi"}).reduce(function(a,x){return a+n(x.summa)},0);
  m.dist={bosh:db,tol:dt,yangi:dy,qarz:db+dy-dt,foiz:db+dy?dt/(db+dy)*100:0,harakat:T.filter(function(x){return x.tur!=="boshlangich"})};

  m.kitob=K.map(function(b){
    var pre=n(b.huquq)+n(b.tarjima)+n(b.tahrir)+n(b.korrektura)+n(b.dizayn)+n(b.smm);
    var chop=n(b.chopDona)*n(b.tiraj), xar=pre+chop;
    var sot=n(b.s50)+n(b.s60), tus=n(b.s50)*n(b.dist)+n(b.s60)*n(b.retail);
    return {id:b.id,nom:b.nom,holat:b.holat,izoh:b.izoh,tiraj:n(b.tiraj),qoldiq:n(b.qoldiq),dist:n(b.dist),retail:n(b.retail),
      pre:pre,chopJ:chop,xar:xar,sot:sot,tus:tus,roy:tus*0.08,sof:tus-xar-tus*0.08,
      tannarx:n(b.tiraj)?xar/n(b.tiraj):0,qoldiqTolov:n(b.qoldiqTolov)};
  });
  m.ombor=m.kitob.reduce(function(a,b){return a+b.qoldiq*b.dist},0);
  m.muzlagan=m.kitob.filter(function(b){return b.holat!=="Savdoda"}).reduce(function(a,b){return a+b.pre-b.qoldiqTolov},0);

  var s7=S.filter(function(x){return kunTo(x.sana)>=-7});
  m.sport7=s7.filter(function(x){return tr(x.sport)}).length;
  m.bomdod7=s7.filter(function(x){return tr(x.bomdod)}).length;
  m.oila7=s7.reduce(function(a,x){return a+n(x.oila)},0);
  var vz=S.filter(function(x){return n(x.vazn)>0}).sort(function(a,b){return new Date(a.sana)-new Date(b.sana)});
  m.vazn=vz.length?n(vz[vz.length-1].vazn):null;

  var q=(D.Qarz||[])[0]||{};
  m.qarz={jami:n(q.jami),tolangan:n(q.tolangan),oylik:n(q.oylik),muddat:q.muddat,
    qoldiq:n(q.jami)-n(q.tolangan),foiz:n(q.jami)?n(q.tolangan)/n(q.jami)*100:0};
  var oyQ=q.muddat?Math.max(1,Math.round((new Date(q.muddat)-new Date(bugun()))/864e5/30.4)):null;
  m.qarz.oyQ=oyQ; m.qarz.temp=oyQ?m.qarz.qoldiq/oyQ:null;

  m.xar=CATS.map(function(c){return {n:c,v:Y.filter(function(x){return x.tur==="chiqim"&&x.cat===c}).reduce(function(a,x){return a+n(x.summa)},0),c:CCOL[c]}})
    .filter(function(x){return x.v>0}).sort(function(a,b){return b.v-a.v});
  m.xarJ=m.xar.reduce(function(a,x){return a+x.v},0);
  m.xarShax=m.xar.filter(function(x){return SHAX.indexOf(x.n)>=0}).reduce(function(a,x){return a+x.v},0);
  m.xarNashr=m.xar.filter(function(x){return NASHR.indexOf(x.n)>=0}).reduce(function(a,x){return a+x.v},0);

  var kunlik=m.kirim30>0?m.kirim30/30:0;
  m.hor=[]; var v={}; KAS.forEach(function(k){v[k]=m.kas[k]});
  for(var i=0;i<=60;i++){
    var d=dOff(i);
    if(i>0){
      v.Karta+=kunlik;
      m.ob.forEach(function(o){ if(o.sana===d){ var mk=o.manbaK||"Karta"; v[mk]=(v[mk]||0)-o.qoldiq } });
      m.kut.forEach(function(x){ if(x.sana===d) v.Hisob+=n(x.summa) });
      if(new Date(d).getDate()===1) m.prg.forEach(function(p){ v.Shaxsiy-=p.summa });
    }
    m.hor.push({K:v.Karta,H:v.Hisob,S:v.Shaxsiy,jami:v.Karta+v.Hisob+v.Shaxsiy});
  }
  m.oxirgi=Y.length?Y.map(function(x){return x.sana}).sort().slice(-1)[0]:null;
  return m;
}

/* ═══════════ TAVSIYA ═══════════ */
function tavsiya(m){
  var r=[];
  function a(w,t,x,y){r.push({w:w,t:t,x:x,y:y})}
  m.kech.forEach(function(o){a(100,"Kechikkan",o.kim+" — "+(-kunTo(o.sana))+" kun kechikdi, "+fmt(o.qoldiq)+" so'm.",
    o.tur==="Huquq"?"Litsenziya riski. Bugun to'lang yoki yozma sana bering.":"Bugun aloqaga chiqib yangi sana bering.")});
  var roy=m.ob.filter(function(o){return o.tur==="Huquq"})[0];
  if(roy&&kunTo(roy.sana)>=0&&kunTo(roy.sana)<=14) a(95,"Huquq","Royalty "+fmt(roy.qoldiq)+" so'm — "+kunTo(roy.sana)+" kun.","Boshqa to'lovlardan oldin shu.");
  var nol=-1; for(var i=1;i<m.hor.length;i++){ if(m.hor[i].K<0){nol=i;break} }
  if(nol>0) a(92,"Kassa","Karta "+nol+" kunda nolga tushadi.","Qaysi to'lovni surasiz yoki qaysi kirimni tezlashtirasiz?");
  if(m.taqchillik<0) a(90,"Kassa","45 kunda "+mln(-m.taqchillik)+" mln yetishmaydi.","Bugun bitta qaror kerak.");
  if(m.muzlagan>50e6) a(75,"Muzlagan pul",mln(m.muzlagan)+" mln tugallanmagan kitoblarda.","Yarim kitob nol beradi. Bittasini tugatish eng yuqori qaytimli ish.");
  if(m.qarz.temp&&m.qarz.temp>m.qarz.oylik+1) a(70,"Qarz","Kerakli temp "+fmt(m.qarz.temp)+"$/oy, to'layapsiz "+fmt(m.qarz.oylik)+"$.","Keyingi tirajdan bir marta katta to'lov qo'shing.");
  if(!m.oxirgi||kunTo(m.oxirgi)<-2) a(60,"Ma'lumot","Ikki kundan ko'p yozuv kirmagan.","20 sekund: bugun qancha tushdi, nimaga chiqdi.");
  if(m.sport7===0) a(45,"Sog'liq","Bu haftada mashg'ulot yo'q.","20 daqiqa yurish ham hisoblanadi.");
  if(m.bomdod7<=4&&(D.Soglik||[]).length>=3) a(50,"Iymon","Oxirgi 7 kunda bomdod "+m.bomdod7+"/7.","Sabab yotish vaqti.");
  if(!r.length) a(10,"Toza","Kechikkan to'lov yo'q.","Maqsad bo'limidan navbatdagi ishni oling.");
  return r.sort(function(x,y){return y.w-x.w});
}

function gorizont(m){
  var w=340,h=110,pl=4,pb=13,d=m.hor;
  var all=[]; d.forEach(function(x){all.push(x.K,x.H,x.S)});
  var mx=Math.max.apply(null,all.concat([0])), mn=Math.min.apply(null,all.concat([0])), rng=Math.max(1,mx-mn);
  function X(i){return pl+i*(w-pl*2)/(d.length-1)}
  function Y(v){return 7+(mx-v)/rng*(h-pb-10)}
  function ln(k){return d.map(function(x,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(x[k]).toFixed(1)}).join(" ")}
  var nol=-1; for(var i=1;i<d.length;i++){if(d[i].K<0){nol=i;break}}
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:116px">'
    +'<line x1="'+pl+'" x2="'+(w-pl)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--coral)" stroke-width=".8" stroke-dasharray="2 3" opacity=".6"/>'
    +'<path class="dr" d="'+ln("K")+'" fill="none" stroke="var(--sky)" stroke-width="1.9"/>'
    +'<path class="dr" d="'+ln("H")+'" fill="none" stroke="var(--amber)" stroke-width="1.5"/>'
    +'<path class="dr" d="'+ln("S")+'" fill="none" stroke="var(--lav)" stroke-width="1.5"/>'
    +'<text x="'+pl+'" y="'+(h-2)+'" fill="var(--dim)" font-size="7.5" font-family="var(--mono)">ko\'k Karta · sariq Hisob · binafsha Shaxsiy</text>'
    +'<text x="'+(w-pl)+'" y="'+(h-2)+'" text-anchor="end" font-size="7.5" font-family="var(--mono)" fill="'+(nol>0?"var(--coral)":"var(--mint)")+'">'
    +(nol>0?"Karta "+nol+" kun":"nolga tushmaydi")+'</text></svg>';
}
function halqa(nom,tol,jami,foiz,manba,col){
  var sz=74,r=sz/2-6,cc=2*Math.PI*r,off=0,segs="";
  (manba||[]).filter(function(x){return x.v>0}).forEach(function(x){
    var len=cc*Math.min(1,x.v/Math.max(1,jami));
    segs+='<circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+KCOL[x.k]+'" stroke-width="6" stroke-dasharray="'+len+' '+(cc-len)+'" stroke-dashoffset="'+(-off)+'"/>';
    off+=len;

  return '<div class="hl"><div style="position:relative;width:'+sz+'px;height:'+sz+'px">'
    +'<svg width="'+sz+'" height="'+sz+'" style="transform:rotate(-90deg)">'

var OYLAR={yanvar:1,fevral:2,mart:3,aprel:4,may:5,iyun:6,iyul:7,avgust:8,sentabr:9,sentyabr:9,oktabr:10,noyabr:11,dekabr:12};
var KALIT={
 Korzinka:["korzinka","oziq","ovqat","non","magazin","bozor","produkt","go'sht","gosht"],
 Kommunal:["svet","elektr","gaz","suv","kommunal","internet","jek dom","musor","isitish","nomer","aloqa"],
 Ayolimga:["ayol","xotin","ayolim","turmush o'rtog"],
 Qizim:["qiz","pampers","podguznik","bola"],
 "Ota-ona":["ona","dada","ota","onam","dadam","ota-ona"],
 Transport:["taksi","taxi","benzin","transport","avtobus","yo'l kira","metro"],
 "Sog'liq":["dori","shifokor","ukol","dorixona","tibbiy","analiz"],
 Sadaqa:["sadaqa","ehson","xayriya","zakot"],
 "Qarz to'lovi":["ilhom","qarz to'lov","qarzga"],
 Bosmaxona:["bosmaxona","tipografiya","chop etish","chop qil","bosildi"],
 Tarjimon:["tarjimon","tarjima"],
 Tahrir:["tahrir","muharrir","sanjar","korrektura","korrektor"],
 Royalty:["royalty","muallif","mualliflik huquq"],
 SMM:["smm","reklama","targetolog","kampaniya"],
 Xodim:["xodim","ish haqi","oylik berdim"],
 Zaxira:["zaxira","jamg'arma","jamgarma"]
};
var KIRIM_SOZ=["tushdi","tushirdi","tushirib","keldi","kirdi","kirim","to'lab berdi","tolab berdi","oldim pul"];
var CHIQIM_SOZ=["berdim","to'ladim","toladim","chiqdi","sarfladim","xarid","sotib oldim","ketdi","to'lov qildim"];

function sonlarniTop(t){
  var res=[],re=/(\d[\d\s.,]*)\s*(mlrd|mlrd\.|milliard|mln|million|ming|k\b|\$|dollar)?/gi,mm;
  while((mm=re.exec(t))!==null){
    var raw=mm[1].replace(/\s/g,"");
    if(raw.indexOf(",")>-1&&raw.indexOf(".")===-1) raw=raw.replace(",",".");
    else raw=raw.replace(/,/g,"");
    var v=parseFloat(raw); if(isNaN(v)) continue;
    var b=(mm[2]||"").toLowerCase();
    if(b.indexOf("mlrd")===0||b.indexOf("milliard")===0) v*=1e9;
    else if(b.indexOf("mln")===0||b.indexOf("million")===0) v*=1e6;
    else if(b==="ming"||b==="k") v*=1000;
    else if(b==="$"||b==="dollar") v*=12006;
    if(v>0) res.push({v:v,i:mm.index,dollar:(b==="$"||b==="dollar")});
  }
  return res;
}
function sanaTop(t){
  var l=t.toLowerCase();
  for(var oy in OYLAR){
    var i=l.indexOf(oy);
    if(i>-1){
      var old=l.slice(Math.max(0,i-14),i);
      var km=old.match(/(\d{1,2})\s*[-–]?\s*$/);
      var kun=km?parseInt(km[1]):1;
      var yil=new Date(bugun()).getFullYear();
      var oyn=OYLAR[oy];
      var d=new Date(yil,oyn-1,kun);
      if(d<new Date(bugun())&&!km) d=new Date(yil+1,oyn-1,kun);
      return d.toISOString().slice(0,10);
    }
  }
  if(/erta(ga)?/.test(l)) return dOff(1);
  if(/kecha/.test(l)) return dOff(-1);
  return null;
}
function kassaTop(t){
  var l=t.toLowerCase();
  if(/shaxsiy/.test(l)) return "Shaxsiy";
  if(/hisob\s*raqam|hisobdan|hisobga|schyot/.test(l)) return "Hisob";
  if(/karta/.test(l)) return "Karta";
  return null;
}
function katTop(t){
  var l=t.toLowerCase();
  for(var c in KALIT){
    for(var i=0;i<KALIT[c].length;i++){ if(l.indexOf(KALIT[c][i])>-1) return c; }
  }
  return null;
}
function parseUz(matn){
  var A=[];
  /* o'nlik kasrni va vaqtni himoyalash */
  var t=matn.replace(/(\d)[.,](\d)/g,"$1\u0001$2");
  var bandlar=t.split(/[.;\n]+|,\s+/).map(function(x){return x.replace(/\u0001/g,".").trim()}).filter(function(x){return x.length>1});

  bandlar.forEach(function(b){
    var l=b.toLowerCase();
    var sonlar=sonlarniTop(b.replace(/\d{1,2}[:.]\d{2}/g," "));
    var kassa=kassaTop(b);
    var kat=katTop(b);
    var sana=sanaTop(b);

    /* sog'liq */
    var sog={};
    if(/bomdod/.test(l)) sog.bomdod=!/qazo|o'tkaz|otkaz|uxlab qoldim|turolmadim/.test(l);
    if(/zal|yugur|sport|mashg'ulot|mashgulot|yurdim|velosiped|suzdim/.test(l)){
      sog.sport=true;
      var tur=(l.match(/zal|yugur|yurish|velosiped|suzish/)||[])[0];
      if(tur) sog.sportTur=tur;
    }
    if(/o'qidim|oqidim|kitob o'qi/.test(l)) sog.oqish=true;
    var vaqt=b.match(/(\d{1,2})[:.](\d{2})/);
    if(vaqt&&/yot|uxla/.test(l)) sog.uyqu=("0"+vaqt[1]).slice(-2)+":"+vaqt[2];
    else if(/yot|uxla/.test(l)&&sonlar.length){ var h=Math.round(sonlar[0].v>100?sonlar[0].v/1000:sonlar[0].v); if(h>=18&&h<=25) sog.uyqu=("0"+(h%24)).slice(-2)+":00"; }
    var vz=l.match(/vazn\w*\s*(\d{2,3})/); if(vz) sog.vazn=parseInt(vz[1]);
    var ol=l.match(/oila\w*\s*(?:bilan\s*)?(\d+(?:\.\d+)?)\s*soat/); if(ol) sog.oila=parseFloat(ol[1]);
    var sogBor=Object.keys(sog).length>0;
    if(sogBor){ sog.type="soglik"; sog.sana=sana||bugun(); A.push(sog); }

    if(!sonlar.length) return;
    var pulSoz=KIRIM_SOZ.concat(CHIQIM_SOZ).some(function(w){return l.indexOf(w)>-1});
    /* sog'liq bandida pul so'zi va kategoriya bo'lmasa — raqam sog'liqniki */
    if(sogBor&&!pulSoz&&!kat&&!/tarqatuvchi|o'tkaz|qoldiq|kerak|gacha/.test(l)) return;
    var summa=sonlar[0].v;

    /* tarqatuvchi */
    if(/tarqatuvchi|distributor/.test(l)){
      if(/qarz|hisobot|balans/.test(l)&&!/tushdi|tushirdi|to'lab/.test(l)){
        A.push({type:"tarqatuvchi",summa:summa,tur:"yangi"});
      } else {
        A.push({type:"kirim",summa:summa,kassa:kassa||"Karta",izoh:"tarqatuvchi"});
        A.push({type:"tarqatuvchi",summa:summa,tur:"tolov"});
      }
      return;
    }
    /* o'tkazma */
    if(/o'tkaz|otkaz|ko'chir|kochir/.test(l)&&/dan/.test(l)&&/ga/.test(l)){
      var dan=null,ga=null;
      if(/kartadan/.test(l))dan="Karta"; if(/shaxsiydan/.test(l))dan="Shaxsiy"; if(/hisobdan/.test(l))dan="Hisob";
      if(/kartaga/.test(l))ga="Karta"; if(/shaxsiyga/.test(l))ga="Shaxsiy"; if(/hisobga/.test(l))ga="Hisob";
      if(dan&&ga&&dan!==ga){ A.push({type:"transfer",summa:summa,kassa:dan,kassaTo:ga}); return; }
    }
    /* qoldiq */
    if(/bor edi|bor\b|qoldiq|qoldi\b/.test(l)&&!/gacha|kerak/.test(l)&&kassa){
      A.push({type:"qoldiq",kassa:kassa,summa:summa}); return;
    }
    /* majburiyat */
    if(/kerak|gacha|qarzim|berishim|to'lashim|tolashim/.test(l)){
      A.push({type:"majburiyat",kim:(kat||"To'lov")+(/\s/.test(b)?"":""),summa:summa,sana:sana||dOff(7),tur:kat&&NASHR.indexOf(kat)>=0?"Jamoa":"Boshqa",izoh:b.slice(0,60)});
      return;
    }
    /* kirim / chiqim */
    var kirim=KIRIM_SOZ.some(function(w){return l.indexOf(w)>-1});
    var chiqim=CHIQIM_SOZ.some(function(w){return l.indexOf(w)>-1});
    if(kirim&&!chiqim) A.push({type:"kirim",summa:summa,kassa:kassa||"Karta",izoh:""});
    else A.push({type:"chiqim",summa:summa,kassa:kassa||(kat&&SHAX.indexOf(kat)>=0?"Shaxsiy":"Karta"),cat:kat||"Boshqa",izoh:""});
  });
  return A;
}
function opisUz(a){
  if(a.type==="kirim") return "Kirim "+fmt(a.summa)+" · "+KNOM[a.kassa]+(a.izoh?" · "+a.izoh:"");
  if(a.type==="chiqim") return "Chiqim "+fmt(a.summa)+" · "+a.cat+" · "+KNOM[a.kassa];
  if(a.type==="transfer") return "O'tkazma "+fmt(a.summa)+" · "+KNOM[a.kassa]+" → "+KNOM[a.kassaTo];
  if(a.type==="tarqatuvchi") return "Tarqatuvchi "+(a.tur==="tolov"?"to'lov −":"yangi +")+fmt(a.summa);
  if(a.type==="qoldiq") return "Qoldiq: "+KNOM[a.kassa]+" = "+fmt(a.summa);
  if(a.type==="majburiyat") return "Majburiyat "+fmt(a.summa)+" · "+a.sana+" · "+(a.izoh||"");
  if(a.type==="soglik"){
    var q=[];
    if(a.bomdod!==undefined) q.push(a.bomdod?"bomdod ✓":"bomdod ✗");
    if(a.sport) q.push("mashg'ulot ✓"+(a.sportTur?" ("+a.sportTur+")":""));
    if(a.oqish) q.push("o'qish ✓");
    if(a.uyqu) q.push("yotdi "+a.uyqu);
    if(a.vazn) q.push("vazn "+a.vazn);
    if(a.oila) q.push("oila "+a.oila+" soat");
    return "Sog'liq: "+q.join(" · ");
  }
  return a.type;
}

var PARSED=null, MATN="";
function matnTahlil(){
  var el=document.getElementById("matnIn");
  MATN = el?el.value:"";
  if(!MATN.trim()) return;
  var a=parseUz(MATN);
  if(!a.length){ belgi("tushunilmadi"); return; }
  a.forEach(function(x,i){x._i=i;x._on=true});
  PARSED=a; render();
}
function joyla(){
  var lst=PARSED.filter(function(x){return x._on});
  PARSED=null; MATN=""; belgi("saqlanyapti…");
  var i=0;
  function keyingi(){
    if(i>=lst.length){ yukla().then(function(){belgi("saqlandi");render()}); return; }
    var a=lst[i++];
    var p=null;
    if(a.type==="kirim"||a.type==="chiqim")
      p=api({amal:"qosh",varaq:"Yozuv",obj:JSON.stringify({sana:a.sana||bugun(),tur:a.type,kassa:a.kassa,kassaTo:"",summa:a.summa,cat:a.cat||"",objId:"",izoh:a.izoh||""})});
    else if(a.type==="transfer")
      p=api({amal:"qosh",varaq:"Yozuv",obj:JSON.stringify({sana:bugun(),tur:"transfer",kassa:a.kassa,kassaTo:a.kassaTo,summa:a.summa,cat:"",objId:"",izoh:""})});
    else if(a.type==="tarqatuvchi")
      p=api({amal:"qosh",varaq:"Tarqatuvchi",obj:JSON.stringify({sana:bugun(),summa:a.summa,tur:a.tur,izoh:""})});
    else if(a.type==="majburiyat")
      p=api({amal:"qosh",varaq:"Majburiyat",obj:JSON.stringify({kim:a.izoh||"To'lov",summa:a.summa,sana:a.sana,tur:a.tur||"Boshqa",manba:"Karta",tolangan:0,paid:false})});
    else if(a.type==="qoldiq"){
      var Y=D.Yozuv||[];
      var inn=Y.filter(function(x){return x.tur==="kirim"&&x.kassa===a.kassa}).reduce(function(s,x){return s+n(x.summa)},0);
      var out=Y.filter(function(x){return x.tur==="chiqim"&&x.kassa===a.kassa}).reduce(function(s,x){return s+n(x.summa)},0);
      p=api({amal:"kassa",nom:a.kassa,qiymat:a.summa-inn+out});
    }
    else if(a.type==="soglik"){
      var r=(D.Soglik||[]).filter(function(x){return x.sana===a.sana})[0];
      if(r){
        var zan=Promise.resolve();
        ["bomdod","sport","oqish","uyqu","vazn","oila","sportTur"].forEach(function(k){
          if(a[k]!==undefined) zan=zan.then(function(){return api({amal:"yangila",varaq:"Soglik",id:a.sana,maydon:k,qiymat:a[k]})});
        });
        p=zan;
      } else {
        p=api({amal:"qosh",varaq:"Soglik",obj:JSON.stringify({sana:a.sana,bomdod:!!a.bomdod,sport:!!a.sport,sportTur:a.sportTur||"",uyqu:a.uyqu||"",vazn:a.vazn||"",oila:a.oila||"",oqish:!!a.oqish})});
      }
    }
    if(!p) p=Promise.resolve();
    p.then(keyingi,keyingi);
  }
  keyingi();
}

function tezSaqla(){
  if(!TZ.sum) return;
  if(TZ.tur==="transfer"&&TZ.kassa===TZ.kassaTo){belgi("bir xil hisob");return}
  var o={sana:bugun(),tur:TZ.tur,kassa:TZ.kassa,kassaTo:TZ.tur==="transfer"?TZ.kassaTo:"",
    summa:TZ.sum,cat:TZ.tur==="chiqim"?TZ.cat:"",objId:TZ.obj||"",izoh:TZ.izoh};
  TZ.sum=0;TZ.izoh="";TZ.obj="";
  qosh("Yozuv",o);
}
function soglikTap(maydon){
  var r=(D.Soglik||[]).filter(function(x){return x.sana===bugun()})[0];
  if(r){ yangi("Soglik",r.sana,maydon,!tr(r[maydon])); }
  else { var o={sana:bugun(),bomdod:false,sport:false,sportTur:"",uyqu:"",vazn:"",oila:"",oqish:false};
    o[maydon]=true; qoshSoglik(o); }
}
function soglikSet(maydon,qiymat){
  var r=(D.Soglik||[]).filter(function(x){return x.sana===bugun()})[0];
  if(r) yangi("Soglik",r.sana,maydon,qiymat);
  else { var o={sana:bugun(),bomdod:false,sport:false,sportTur:"",uyqu:"",vazn:"",oila:"",oqish:false};
    o[maydon]=qiymat; qoshSoglik(o); }
}
function qoshSoglik(o){
  belgi("saqlanyapti…");
  api({amal:"qosh",varaq:"Soglik",obj:JSON.stringify(o)}).then(function(j){
    if(j.ok){ if(!D.Soglik)D.Soglik=[]; D.Soglik.push(o); belgi("saqlandi"); render(); }
  }).catch(function(){belgi("ulanmadi")});
}

    for(var i=13;i>=0;i--){
      var dt=dOff(-i), r=(D.Soglik||[]).filter(function(y){return y.sana===dt})[0];
      h+='<div style="flex:1;height:24px;border-radius:6px;background:'+(r&&tr(r[x[1]])?x[2]:"var(--card2)")+'"></div>';
    }
    h+='</div></div>';
  });
  return h+'</div>';
}

function ekranMaqsad(m){
  var h="";
  ["work","life"].forEach(function(soha){
    var lst=(D.Target||[]).filter(function(t){return t.soha===soha});
    if(!lst.length) return;
    h+='<div class="card"><div class="lbl"><span>'+(soha==="work"?"Work target":"Life target")+'</span><b>'+lst.filter(function(t){return t.holat!=="Bajarildi"}).length+' ochiq</b></div>';
    lst.forEach(function(t){
      var dd=kunTo(t.muddat), done=t.holat==="Bajarildi";
      h+='<div style="padding:8px 0;border-bottom:1px solid var(--card2);opacity:'+(done?.5:1)+'">'
        +'<div style="font-size:12.5px;line-height:1.35;'+(done?"text-decoration:line-through":"")+'">'+esc(t.nom)+'</div>'
        +'<div style="display:flex;gap:7px;align-items:center;margin-top:5px;flex-wrap:wrap">'
        +'<select style="width:auto;padding:4px 7px;font-size:10px" onchange="yangi(\'Target\',\''+t.id+'\',\'holat\',this.value)">'
        +["Boshlanmagan","Ishda","Kutilyapti","Bajarildi"].map(function(x){return '<option'+(t.holat===x?" selected":"")+'>'+x+'</option>'}).join("")
        +'</select><span style="font-family:var(--mono);font-size:9.5px;color:'+(dd<0?"var(--coral)":dd<=10?"var(--amber)":"var(--dim)")+'">'
        +(done?"":(dd<0?(-dd)+" kun o'tdi":dd+" kun"))+'</span>'
        +'<span style="font-size:9.5px;color:var(--dim)">'+esc(t.cat)+'</span></div></div>';
    });
    h+='</div>';
  });
  return h;
}

function ekranSozla(m){
  var h='<div class="card"><div class="lbl"><span>Joriy qoldiq</span><b>to\'g\'rilash</b></div>'
    +'<p style="font-size:10.5px;color:var(--dim);line-height:1.45;margin:0 0 9px">Hisobdagi haqiqiy summani yozing — boshlang\'ich o\'zi qayta hisoblanadi.</p>';
  KAS.forEach(function(k){
    h+='<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">'
      +'<span style="width:8px;height:8px;border-radius:2px;background:'+KCOL[k]+'"></span>'
      +'<span style="flex:1;font-size:11.5px">'+KNOM[k]+'</span>'
      +'<span style="font-family:var(--mono);font-size:10.5px;color:'+(m.kas[k]<0?"var(--coral)":"var(--dim)")+';min-width:76px;text-align:right">'+fmt(m.kas[k])+'</span>'
      +'<input style="width:96px;padding:6px 8px;font-size:11px" inputmode="decimal" placeholder="haqiqiy" onchange="qoldiqSet(\''+k+'\',Number(this.value)||0);this.value=\'\'"></div>';
  });
  h+='</div>';
  h+='<div class="card"><div class="lbl"><span>Ma\'lumot</span></div>'
    +'<p style="font-size:11.5px;color:var(--mute);line-height:1.5;margin:0 0 9px">Hamma ma\'lumot Google Sheets\'da saqlanadi. Yo\'qolmaydi, nusxa olish shart emas.</p>'
    +'<button class="btn2" onclick="qayta()">Qayta yuklash</button></div>';
  return h;
}
function qoldiqSet(k,target){
  var Y=D.Yozuv||[];
  var inn=Y.filter(function(x){return x.tur==="kirim"&&x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)
    +Y.filter(function(x){return x.tur==="transfer"&&x.kassaTo===k}).reduce(function(a,x){return a+n(x.summa)},0);
  var out=Y.filter(function(x){return x.tur==="chiqim"&&x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)
    +Y.filter(function(x){return x.tur==="transfer"&&x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0);
  kassaBelgila(k,target-inn+out);
}
function qayta(){ document.getElementById("app").innerHTML='<div class="load">Yuklanyapti…</div>'; yukla().then(render).catch(xatoKor); }

/* ═══════════ RENDER ═══════════ */
var TABS=[["bugun","Bugun"],["pul","Pul"],["kitob","Kitob"],["hayot","Hayot"],["maqsad","Maqsad"],["sozla","Sozlash"]];
function render(){
  var m=hisob();
  var nomi=TABS.filter(function(t){return t[0]===tab})[0][1];
  var h='<div class="top"><div><div class="brand">MFB · Mening hayotim</div><h1>'+nomi+'</h1></div>'
    +'<div class="meta">'+bugun()+'<div id="holat" style="color:var(--mint)">'+esc(holat)+'</div></div></div>';
  if(tab==="bugun") h+=ekranBugun(m);
  if(tab==="pul") h+=ekranPul(m);
  if(tab==="kitob") h+=ekranKitob(m);
  if(tab==="hayot") h+=ekranHayot(m);
  if(tab==="maqsad") h+=ekranMaqsad(m);
  if(tab==="sozla") h+=ekranSozla(m);
  document.getElementById("app").innerHTML=h;
  document.getElementById("nav").innerHTML=TABS.map(function(t){
    return '<button class="'+(tab===t[0]?"on":"")+'" onclick="tab=\''+t[0]+'\';render();window.scrollTo(0,0)">'+t[1]+'</button>';
  }).join("");
}
function xatoKor(e){
  document.getElementById("app").innerHTML='<div class="card"><div class="lbl"><span>Xato</span></div>'
    +'<p style="font-size:12px;color:var(--coral);line-height:1.5">'+esc(String(e))+'</p>'
    +'<button class="btn" style="margin-top:9px" onclick="qayta()">Qayta urinish</button></div>';
}

/* ═══════════ BOSHLASH ═══════════ */
try{ if(window.Telegram&&Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); } }catch(e){}
yukla().then(render).catch(xatoKor);
</script>
