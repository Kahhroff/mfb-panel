<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MFB · Mening hayotim</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0A1118; --card:#131C26; --card2:#1B2733; --card3:#243342; --line:#26333F;
  --txt:#F0F5F8; --mute:#8FA3B0; --dim:#5D7080;
  --mint:#43E39B; --sky:#4FA9F5; --amber:#FFC24B; --coral:#FF7A5C; --lav:#B18CFF; --rose:#FF6F9C;
  --mono:ui-monospace,'SF Mono','Roboto Mono',Menlo,monospace;
  --disp:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:640px;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:14px 12px 78px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:12px}
.brand{font-family:var(--mono);font-size:7.5px;letter-spacing:.22em;color:var(--amber);text-transform:uppercase}
h1{font-family:var(--disp);font-size:23px;font-weight:400;margin:2px 0 0}
.meta{font-family:var(--mono);font-size:8.5px;color:var(--dim);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;
  animation:fi .35s cubic-bezier(.4,0,.2,1)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:11px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lbl b{color:var(--amber);font-weight:400}
.big{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
.kpi{background:var(--card2);border-radius:14px;padding:11px 12px}
.kpi .k{font-size:9.5px;color:var(--mute)}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:4px;line-height:1}
.kpi .s{font-size:8.5px;color:var(--dim);margin-top:4px}
button{font-family:var(--mono);cursor:pointer;border:none;border-radius:12px}
.btn{background:var(--amber);color:#0A1118;padding:12px 16px;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:700;width:100%}
.btn2{background:var(--card2);color:var(--mute);padding:9px 13px;font-size:9.5px;text-transform:uppercase}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:9px 11px;
  font-family:var(--mono);font-size:13px;width:100%;outline:none;border-radius:11px;-webkit-appearance:none}
label.f{font-size:9px;color:var(--mute);display:block;margin-bottom:4px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:rgba(19,28,38,.94);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:30}
nav button{flex:1;background:none;border-radius:0;padding:11px 1px 16px;color:var(--dim);font-size:8.5px}
nav button.on{color:var(--amber);font-weight:700}
nav button i{display:block;width:100%;height:2px;background:transparent;margin-bottom:8px;border-radius:2px}
nav button.on i{background:var(--amber)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--card2);font-size:12px}
.tag{border-radius:7px;padding:3px 7px;font-family:var(--mono);font-size:8px;font-weight:700;color:#0A1118;flex-shrink:0}
.pill{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:13px;margin-bottom:10px}
.pill button{flex:1;background:none;color:var(--mute);padding:9px 4px;font-size:10px;text-transform:uppercase}
.pill button.on{background:var(--card3);color:var(--amber);font-weight:700}
.ico{width:30px;height:30px;border-radius:10px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-bottom:10px}
.catgrid button{background:var(--card2);border:1.5px solid transparent;border-radius:13px;padding:8px 2px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-size:7.5px;line-height:1.1;text-align:center}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.chips button{flex:1 1 52px;background:var(--card2);color:var(--txt);padding:9px 2px;font-size:10px}
.acc{display:flex;gap:6px}
.acc button{flex:1;background:var(--card2);color:var(--mute);padding:11px 3px;font-size:10px}
.ch{width:100%;height:170px}
.ch.sm{height:120px}
.warn{padding:10px 12px;background:rgba(255,122,92,.1);border-radius:12px;font-size:11px;color:var(--coral);
  line-height:1.45;margin-top:9px}
.load{text-align:center;padding:70px 20px;color:var(--mute);font-family:var(--mono);font-size:12px}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex}
</style>
</head>
<body>
<div id="app"><div class="load">Yuklanyapti…</div></div>
<nav id="nav"></nav>

<script>
var API="https://script.google.com/macros/s/AKfycby0AbDC_RZEFG_Six9rwGsWrRlHDWM1hF5ykd_cU12F1SOGsJ9TVY_nLCNCB7sfOu7_/exec";
var MAXFIY="ram5657";

var D=null, tab="bugun", holat="", CH=[];
var CATS=["Korzinka","Kommunal","Ayolimga","Qizim","Ota-ona","Transport","Sog'liq","Sadaqa","Qarz to'lovi","Bosmaxona","Tarjimon","Tahrir","Korrektura","Dizayn","Royalty","SMM","Xodim","Zaxira","Boshqa"];
var SHAX=["Korzinka","Kommunal","Ayolimga","Qizim","Ota-ona","Transport","Sog'liq","Sadaqa"];
var NASHR=["Bosmaxona","Tarjimon","Tahrir","Korrektura","Dizayn","Royalty","SMM","Xodim"];
var KAS=["Karta","Hisob","Shaxsiy"];
var CV=getComputedStyle(document.documentElement);
function c(v){return CV.getPropertyValue("--"+v).trim()}
var KCOL={Karta:c("sky"),Hisob:c("amber"),Shaxsiy:c("lav")};
var KNOM={Karta:"Karta",Hisob:"Hisob raqam",Shaxsiy:"Shaxsiy"};
var CCOL={Korzinka:c("mint"),Kommunal:c("sky"),Ayolimga:c("rose"),Qizim:c("lav"),"Ota-ona":c("lav"),
Transport:c("dim"),"Sog'liq":c("coral"),Sadaqa:c("mint"),"Qarz to'lovi":c("sky"),Bosmaxona:c("amber"),
Tarjimon:c("amber"),Tahrir:c("amber"),Korrektura:c("amber"),Dizayn:c("sky"),Royalty:c("coral"),SMM:c("amber"),Xodim:c("amber"),Zaxira:c("mint"),Boshqa:c("dim")};
var PALITRA=["#43E39B","#4FA9F5","#FFC24B","#FF7A5C","#B18CFF","#FF6F9C","#3FD9C9","#F5A65B",
"#7ED957","#6C8CFF","#FFD84D","#FF8FA3","#5BC0EB","#C77DFF","#FFAD5B","#4ECDC4","#F06595","#9BE564"];
var _RANG={},_RI=0;
function rangOl(nom){
  if(!_RANG[nom]){_RANG[nom]=PALITRA[_RI%PALITRA.length];_RI++}
  return _RANG[nom];
}
function ccol(x){return CCOL[x]||rangOl(x)}

function n(v){var x=Number(v);return isNaN(x)?0:x}
function fmt(v){return isNaN(v)||v===null?"—":Math.round(v).toLocaleString("ru-RU").replace(/,/g," ")}
function mln(v){return isNaN(v)||v===null?"—":(v/1e6).toFixed(1)}
function bugun(){return new Date(Date.now()+5*36e5).toISOString().slice(0,10)}
function kunTo(s){var t=new Date(s).getTime();return isNaN(t)?999:Math.round((t-new Date(bugun()).getTime())/864e5)}
function dOff(i){return new Date(new Date(bugun()).getTime()+i*864e5).toISOString().slice(0,10)}
function tr(v){return v===true||v==="TRUE"||v==="true"||v===1}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

var ICO={
 Korzinka:'<path d="M3 7h18l-2 12H5L3 7z"/><path d="M8 7V4a4 4 0 018 0v3"/>',
 Kommunal:'<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>',
 Ayolimga:'<circle cx="12" cy="7" r="4"/><path d="M12 11v7M9 21h6M9 15h6"/>',
 Qizim:'<circle cx="12" cy="8" r="3.5"/><path d="M6 21c0-4 2.7-6.5 6-6.5s6 2.5 6 6.5"/>',
 "Ota-ona":'<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M3 20c0-3 2.2-5 5-5M21 20c0-3-2.2-5-5-5"/>',
 Transport:'<path d="M4 15l2-6h12l2 6M3 15h18v4H3v-4z"/><circle cx="7" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/>',
 "Sog'liq":'<path d="M12 20s-7-4.5-7-9.5A4 4 0 0112 8a4 4 0 017 2.5c0 5-7 9.5-7 9.5z"/>',
 Sadaqa:'<path d="M4 13c2-3 5-3 8 0l4 4M4 13v6h13M17 10l3-3"/>',
 "Qarz to'lovi":'<path d="M3 12h14M13 7l5 5-5 5"/>',
 Bosmaxona:'<path d="M7 8V3h10v5M7 18v3h10v-3"/><rect x="3" y="8" width="18" height="10" rx="2"/>',
 Tarjimon:'<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/>',
 Tahrir:'<path d="M5 19h14M8 15l9-9 3 3-9 9H8v-3z"/>',
 Korrektura:'<path d="M4 12l5 5L20 6"/><path d="M4 19h16"/>',
 Dizayn:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>',
 Royalty:'<path d="M4 8l4 4 4-8 4 8 4-4v11H4V8z"/>',
 SMM:'<path d="M4 10v4h3l6 4V6l-6 4H4zM17 9a4 4 0 010 6"/>',
 Xodim:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M17 8h4M19 6v4"/>',
 Zaxira:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>',
 Kirim:'<path d="M12 20V5M7 10l5-5 5 5"/>',
 Tarqatuvchi:'<rect x="3" y="9" width="12" height="8" rx="1"/><path d="M15 12h3l3 3v2h-6"/><circle cx="7" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
 Boshqa:'<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>'};
function ico(nom,col,sz){
 return '<svg width="'+(sz||16)+'" height="'+(sz||16)+'" viewBox="0 0 24 24" fill="none" stroke="'+(col||c("mute"))
  +'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICO[nom]||ICO.Boshqa)+'</svg>';
}

/* ═════ SERVER ═════ */
function api(p){
  var u=API+"?maxfiy="+encodeURIComponent(MAXFIY);
  for(var k in p) u+="&"+k+"="+encodeURIComponent(p[k]);
  return fetch(u).then(function(r){return r.json()});
}
function yukla(){return api({amal:"hammasi"}).then(function(j){if(!j.ok)throw new Error(j.xato||"xato");D=j.data;return D})}
function belgi(t){holat=t;var e=document.getElementById("holat");if(e)e.textContent=t;
  if(t)setTimeout(function(){holat="";var e2=document.getElementById("holat");if(e2)e2.textContent=""},1800)}
function qosh(v,o){belgi("saqlanyapti…");
  return api({amal:"qosh",varaq:v,obj:JSON.stringify(o)}).then(function(j){
    if(j.ok){if(!D[v])D[v]=[];D[v].push(j.obj);belgi("saqlandi");render()}else belgi("xato: "+j.xato)
  }).catch(function(){belgi("ulanmadi")})}
function yangi(v,id,m,q){belgi("saqlanyapti…");
  return api({amal:"yangila",varaq:v,id:id,maydon:m,qiymat:q}).then(function(j){
    if(j.ok){D[v].forEach(function(x){if(String(x.id)===String(id))x[m]=q});belgi("saqlandi");render()}
  }).catch(function(){belgi("ulanmadi")})}
function ochir(v,id){belgi("o'chirilyapti…");
  return api({amal:"ochir",varaq:v,id:id}).then(function(j){
    if(j.ok){D[v]=D[v].filter(function(x){return String(x.id)!==String(id)});belgi("o'chdi");render()}
  }).catch(function(){belgi("ulanmadi")})}
function kassaBelgila(nom,q){belgi("saqlanyapti…");
  return api({amal:"kassa",nom:nom,qiymat:q}).then(function(j){
    if(j.ok){var b=false;D.Kassa.forEach(function(x){if(x.nom===nom){x.boshlangich=q;b=true}});
      if(!b)D.Kassa.push({nom:nom,boshlangich:q});belgi("saqlandi");render()}
  }).catch(function(){belgi("ulanmadi")})}

/* ═════ HISOB ═════ */
function hisob(){
  var Y=D.Yozuv||[],M=D.Majburiyat||[],K=D.Kitob||[],T=D.Tarqatuvchi||[],S=D.Soglik||[],P=D.Prognoz||[];
  var m={};
  function s(t,k){return Y.filter(function(x){return x.tur===t&&(k?x.kassa===k:1)}).reduce(function(a,x){return a+n(x.summa)},0)}
  function ti(k){return Y.filter(function(x){return x.tur==="transfer"&&x.kassaTo===k}).reduce(function(a,x){return a+n(x.summa)},0)}
  function to(k){return Y.filter(function(x){return x.tur==="transfer"&&x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)}
  function b(k){var r=(D.Kassa||[]).filter(function(x){return x.nom===k})[0];return r?n(r.boshlangich):0}
  m.kas={};KAS.forEach(function(k){m.kas[k]=b(k)+s("kirim",k)-s("chiqim",k)+ti(k)-to(k)});
  m.kassa=KAS.reduce(function(a,k){return a+m.kas[k]},0);

  var i30=Y.filter(function(x){return kunTo(x.sana)>=-30});
  m.kirim30=i30.filter(function(x){return x.tur==="kirim"}).reduce(function(a,x){return a+n(x.summa)},0);
  m.chiqim30=i30.filter(function(x){return x.tur==="chiqim"}).reduce(function(a,x){return a+n(x.summa)},0);
  m.kirim7=Y.filter(function(x){return kunTo(x.sana)>=-7&&x.tur==="kirim"}).reduce(function(a,x){return a+n(x.summa)},0);

  m.ob=M.filter(function(x){return !tr(x.paid)}).map(function(o){
    var tol=Y.filter(function(x){return x.tur==="chiqim"&&String(x.objId)===String(o.id)});
    var jt=tol.reduce(function(a,x){return a+n(x.summa)},0)+n(o.tolangan);
    return {id:o.id,kim:o.kim,summa:n(o.summa),sana:o.sana,tur:o.tur,manbaK:o.manba||"Karta",tol:jt,
      qoldiq:Math.max(0,n(o.summa)-jt),foiz:n(o.summa)?Math.min(100,jt/n(o.summa)*100):0,
      manba:KAS.map(function(k){return{k:k,v:tol.filter(function(x){return x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)}})};
  });
  m.ob45=m.ob.filter(function(o){return kunTo(o.sana)<=45});
  m.ob45J=m.ob45.reduce(function(a,o){return a+o.qoldiq},0);
  m.kech=m.ob.filter(function(o){return kunTo(o.sana)<0});
  m.kut=(D.Kutilayotgan||[]).filter(function(x){return !tr(x.paid)});
  m.kutJ=m.kut.filter(function(x){return kunTo(x.sana)<=45}).reduce(function(a,x){return a+n(x.summa)},0);
  m.taqchillik=m.kassa+m.kutJ-m.ob45J;
  m.kunlar=m.chiqim30>0?Math.round(m.kassa/(m.chiqim30/30)):null;

  var oy=bugun().slice(0,7);
  m.prg=P.map(function(p){
    var cats=String(p.cats||"").split(",").map(function(x){return x.trim()});
    var sf=Y.filter(function(x){return x.tur==="chiqim"&&cats.indexOf(x.cat)>=0&&String(x.sana).slice(0,7)===oy});
    var j=sf.reduce(function(a,x){return a+n(x.summa)},0);
    return {nom:p.nom,summa:n(p.summa),ico:p.ico,sarf:j,foiz:n(p.summa)?j/n(p.summa)*100:0,
      manba:KAS.map(function(k){return{k:k,v:sf.filter(function(x){return x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)}})};
  });

  var db=0,dt=0,dy=0;
  T.forEach(function(x){var v=n(x.summa);if(x.tur==="boshlangich")db+=v;else if(x.tur==="tolov")dt+=v;else dy+=v});
  m.dist={bosh:db,tol:dt,yangi:dy,qarz:db+dy-dt,foiz:db+dy?dt/(db+dy)*100:0,
    harakat:T.filter(function(x){return x.tur!=="boshlangich"})};

  function nrmk(x){return String(x||"").trim().toLowerCase().replace(/['\u2018\u2019]/g,"")}
  var FOIZ={};
  (D.KitobFoiz||[]).forEach(function(r){if(r.kitob)FOIZ[nrmk(r.kitob)]=n(r.foiz)||8});
  m.kitob=K.map(function(bk){
    var pre=n(bk.huquq)+n(bk.tarjima)+n(bk.tahrir)+n(bk.korrektura)+n(bk.dizayn)+n(bk.smm);
    var trj=(D.Tiraj||[]).filter(function(t){return nrmk(t.kitob)===nrmk(bk.nom)})
      .sort(function(a,b2){return n(a.raqam)-n(b2.raqam)});
    var tiraj=0,chop=0;
    if(trj.length){trj.forEach(function(t){tiraj+=n(t.nusxa);chop+=n(t.nusxa)*n(t.narxDona)})}
    else{tiraj=n(bk.tiraj);chop=n(bk.chopDona)*tiraj}
    var xar=pre+chop;
    var sot=n(bk.s50)+n(bk.s60),tus=n(bk.s50)*n(bk.dist)+n(bk.s60)*n(bk.retail);
    var foiz=FOIZ[nrmk(bk.nom)]||8, roy=tus*foiz/100;
    return {id:bk.id,nom:bk.nom,holat:bk.holat,izoh:bk.izoh,tiraj:tiraj,qoldiq:n(bk.qoldiq),
      dist:n(bk.dist),retail:n(bk.retail),pre:pre,xar:xar,sot:sot,tus:tus,roy:roy,foiz:foiz,
      tirajlar:trj,sof:tus-xar-roy,tannarx:tiraj?xar/tiraj:0,qoldiqTolov:n(bk.qoldiqTolov)};
  });
  m.ombor=m.kitob.reduce(function(a,x){return a+x.qoldiq*x.dist},0);
  m.muzlagan=m.kitob.filter(function(x){return x.holat!=="Savdoda"}).reduce(function(a,x){return a+x.pre-x.qoldiqTolov},0);

  var s7=S.filter(function(x){return kunTo(x.sana)>=-7});
  m.sport7=s7.filter(function(x){return tr(x.sport)}).length;
  m.bomdod7=s7.filter(function(x){return tr(x.bomdod)}).length;
  m.oila7=s7.reduce(function(a,x){return a+n(x.oila)},0);
  m.vaznSer=S.filter(function(x){return n(x.vazn)>0}).sort(function(a,b2){return new Date(a.sana)-new Date(b2.sana)})
    .map(function(x){return [String(x.sana).slice(0,10),n(x.vazn)]});
  m.vazn=m.vaznSer.length?m.vaznSer[m.vaznSer.length-1][1]:null;

  var q=(D.Qarz||[])[0]||{};
  m.qarz={jami:n(q.jami),tolangan:n(q.tolangan),oylik:n(q.oylik),muddat:q.muddat,
    qoldiq:n(q.jami)-n(q.tolangan),foiz:n(q.jami)?n(q.tolangan)/n(q.jami)*100:0};
  var oq=q.muddat?Math.max(1,Math.round((new Date(q.muddat)-new Date(bugun()))/864e5/30.4)):null;
  m.qarz.oyQ=oq;m.qarz.temp=oq?m.qarz.qoldiq/oq:null;

  function nrm(t){return String(t||"").trim().toLowerCase().replace(/['\u2018\u2019]/g,"")}
  var kir={},kirNom={};
  Y.forEach(function(x){
    if(x.tur!=="kirim")return;
    var xom=x.cat||x.izoh||"Boshqa kirim";
    var k=nrm(xom);
    /* imlo farqi bo'lgan nomlarni birlashtirish */
    for(var mavjud in kirNom){
      if(mavjud===k)break;
      if(Math.abs(mavjud.length-k.length)<=2){
        var f=0,uz=Math.max(mavjud.length,k.length);
        for(var i2=0,j2=0;i2<mavjud.length||j2<k.length;){
          if(mavjud[i2]===k[j2]){i2++;j2++}
          else{f++;if(mavjud.length>k.length)i2++;else if(k.length>mavjud.length)j2++;else{i2++;j2++}}
          if(f>1)break;
        }
        if(f<=1){k=mavjud;break}
      }
    }
    if(!kirNom[k])kirNom[k]=xom.charAt(0).toUpperCase()+xom.slice(1);
    kir[k]=(kir[k]||0)+n(x.summa);
  });
  m.kirTaq=Object.keys(kir).map(function(k){return{n:kirNom[k]||k,v:kir[k],c:ccol(k)}}).sort(function(a,b2){return b2.v-a.v});
  m.kirJ=m.kirTaq.reduce(function(a,x){return a+x.v},0);
  var kirKas={};
  Y.forEach(function(x){if(x.tur==="kirim"){kirKas[x.kassa]=(kirKas[x.kassa]||0)+n(x.summa)}});
  m.kirKassa=KAS.filter(function(k){return kirKas[k]>0}).map(function(k){return{n:KNOM[k],v:kirKas[k],c:KCOL[k]}});

  var kats={};
  Y.forEach(function(x){if(x.tur==="chiqim"&&x.cat){kats[x.cat]=(kats[x.cat]||0)+n(x.summa)}});
  m.xar=Object.keys(kats).map(function(k){return{n:k,v:kats[k],c:ccol(k)}}).sort(function(a,b2){return b2.v-a.v});
  m.xarJ=m.xar.reduce(function(a,x){return a+x.v},0);
  function katGuruh(nom){
    if(SHAX.indexOf(nom)>=0)return "Shaxsiy";
    if(NASHR.indexOf(nom)>=0)return "Nashriyot";
    var r=(D.Kategoriya||[]).filter(function(x){return String(x.nom).toLowerCase()===String(nom).toLowerCase()})[0];
    if(r&&r.guruh)return /nashr/i.test(r.guruh)?"Nashriyot":"Shaxsiy";
    return null;
  }
  m.xarShax=m.xar.filter(function(x){return katGuruh(x.n)==="Shaxsiy"}).reduce(function(a,x){return a+x.v},0);
  m.xarNashr=m.xar.filter(function(x){return katGuruh(x.n)==="Nashriyot"}).reduce(function(a,x){return a+x.v},0);

  var kd=m.kirim30>0?m.kirim30/30:0;
  m.hor=[];var v={};KAS.forEach(function(k){v[k]=m.kas[k]});
  for(var i=0;i<=60;i++){
    var d=dOff(i);
    if(i>0){
      v.Karta+=kd;
      m.ob.forEach(function(o){if(o.sana===d){var mk=o.manbaK||"Karta";v[mk]=(v[mk]||0)-o.qoldiq}});
      m.kut.forEach(function(x){if(x.sana===d)v.Hisob+=n(x.summa)});
      if(new Date(d).getDate()===1)m.prg.forEach(function(p){v.Shaxsiy-=p.summa});
    }
    m.hor.push({d:d,K:v.Karta,H:v.Hisob,S:v.Shaxsiy});
  }
  m.oxirgi=Y.length?Y.map(function(x){return x.sana}).sort().slice(-1)[0]:null;
  return m;
}

/* ═════ TAVSIYA ═════ */
function tavsiya(m){
  var r=[];function a(w,t,x,y){r.push({w:w,t:t,x:x,y:y})}
  m.kech.forEach(function(o){a(100,"Kechikkan",o.kim+" — "+(-kunTo(o.sana))+" kun kechikdi, "+fmt(o.qoldiq)+" so'm.",
    o.tur==="Huquq"?"Litsenziya riski. Bugun to'lang yoki yozma sana bering.":"Bugun aloqaga chiqib yangi sana bering.")});
  var roy=m.ob.filter(function(o){return o.tur==="Huquq"})[0];
  if(roy&&kunTo(roy.sana)>=0&&kunTo(roy.sana)<=14)a(95,"Huquq","Royalty "+fmt(roy.qoldiq)+" so'm — "+kunTo(roy.sana)+" kun.","Boshqa to'lovlardan oldin shu.");
  var nol=-1;for(var i=1;i<m.hor.length;i++){if(m.hor[i].K<0){nol=i;break}}
  if(nol>0)a(92,"Kassa","Karta "+nol+" kunda nolga tushadi.","Qaysi to'lovni surasiz yoki qaysi kirimni tezlashtirasiz?");
  if(m.taqchillik<0)a(90,"Kassa","45 kunda "+mln(-m.taqchillik)+" mln yetishmaydi.","Bugun bitta qaror kerak.");
  if(m.muzlagan>50e6)a(75,"Muzlagan pul",mln(m.muzlagan)+" mln tugallanmagan kitoblarda.","Bittasini tugatish eng yuqori qaytimli ish.");
  if(m.qarz.temp&&m.qarz.temp>m.qarz.oylik+1)a(70,"Qarz","Kerakli temp "+fmt(m.qarz.temp)+"$/oy, to'layapsiz "+fmt(m.qarz.oylik)+"$.","Keyingi tirajdan katta to'lov qo'shing.");
  if(!m.oxirgi||kunTo(m.oxirgi)<-2)a(60,"Ma'lumot","Ikki kundan ko'p yozuv kirmagan.","Botga bir qator yozing.");
  if(m.sport7===0)a(45,"Sog'liq","Bu haftada mashg'ulot yo'q.","20 daqiqa yurish ham hisoblanadi.");
  if(m.bomdod7<=4&&(D.Soglik||[]).length>=3)a(50,"Iymon","Oxirgi 7 kunda bomdod "+m.bomdod7+"/7.","Sabab yotish vaqti.");
  if(!r.length)a(10,"Toza","Kechikkan to'lov yo'q.","Maqsad bo'limidan navbatdagi ishni oling.");
  return r.sort(function(x,y){return y.w-x.w});
}

function grad(col,a1,a2){return new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:col+a1},{offset:1,color:col+a2}])}
function chart(id,opt){CH.push({id:id,opt:opt});return '<div class="ch" id="'+id+'"></div>'}
function chartSm(id,opt){CH.push({id:id,opt:opt});return '<div class="ch sm" id="'+id+'"></div>'}
function chizGrafik(){
  CH.forEach(function(x){
    var el=document.getElementById(x.id);
    if(!el)return;
    var ec=echarts.init(el,null,{renderer:"canvas"});

}

function halqaHTML(nom,tol,jami,foiz,manba,col){
  var sz=78,r=sz/2-6,cc=2*Math.PI*r,off=0,segs="";
  (manba||[]).filter(function(x){return x.v>0}).forEach(function(x){
    var len=cc*Math.min(1,x.v/Math.max(1,jami));
    segs+='<circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+KCOL[x.k]
      +'" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="'+len+' '+(cc-len)+'" stroke-dashoffset="'+(-off)+'"/>';
    off+=len;
  });
  if(!segs)segs='<circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+(col||c("amber"))
    +'" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="'+cc+'" stroke-dashoffset="'+(cc-cc*Math.min(100,foiz)/100)+'"/>';
  return '<div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-width:88px">'
    +'<div style="position:relative;width:'+sz+'px;height:'+sz+'px">'
    +'<svg width="'+sz+'" height="'+sz+'" style="transform:rotate(-90deg)">'
    +'<circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+c("card2")+'" stroke-width="6.5"/>'+segs+'</svg>'
    +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'
    +'<span style="font-family:var(--mono);font-size:13px;font-weight:700;color:'+(foiz>=100?c("coral"):c("txt"))+'">'+Math.round(foiz)+'%</span>'
    +'<span style="font-size:7.5px;color:'+c("dim")+'">'+mln(Math.max(0,jami-tol))+' qoldi</span></div></div>'
    +'<span style="font-size:8.5px;color:'+c("mute")+';text-align:center;line-height:1.2;max-width:96px">'+esc(nom)+'</span>'
    +'<span style="font-family:var(--mono);font-size:8px;color:'+c("dim")+'">'+mln(tol)+' / '+mln(jami)+'</span></div>';
}

      h+='<div class="row"><span class="ico">'+ico(x.n,xc,15)+'</span><div style="flex:1">'

        +'<div class="bar" style="height:4px;margin-top:4px"><div style="width:'+(x.v/m.xarJ*100)+'%;background:'+xc+'"></div></div></div>'
        +'<div style="text-align:right"><div style="font-family:var(--mono);font-size:11.5px">'+fmt(x.v)+'</div>'
        +'<div style="font-family:var(--mono);font-size:8px;color:var(--dim)">'+Math.round(x.v/m.xarJ*100)+'%</div></div></div>';
    });
    h+='</div>';
  }

  h+='<div class="card"><div class="lbl"><span>To\'lov kalendari</span><b>'+mln(m.ob45J)+' mln</b></div>';
  m.ob45.sort(function(a,b2){return new Date(a.sana)-new Date(b2.sana)}).forEach(function(o){
    var dd=kunTo(o.sana);
    h+='<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:5px">'
      +'<span>'+esc(o.kim)+'</span><span style="font-family:var(--mono);font-size:10.5px;color:'+(dd<=7?c("coral"):c("mute"))+'">'+fmt(o.qoldiq)+'</span></div>'
      +'<div class="bar">';
    o.manba.filter(function(x){return x.v>0}).forEach(function(x){
      h+='<div style="width:'+(x.v/Math.max(1,o.summa)*100)+'%;background:'+KCOL[x.k]+'"></div>';
    });
    h+='<div style="flex:1;background:'+(dd<0?c("rose"):dd<=7?c("coral"):c("card3"))+'"></div></div>'
      +'<div style="font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:4px">'+o.sana+' · '
      +(dd<0?(-dd)+" kun kechikdi":dd+" kun")+' · to\'langan '+mln(o.tol)+' / '+mln(o.summa)
      +'</div></div>';
  });
  h+='</div>';

  if(m.qarz.jami){
    h+='<div class="card"><div class="lbl"><span>Ilhom aka</span><b>'+fmt(m.qarz.qoldiq)+'$ qoldiq</b></div>'
      +'<div style="height:22px;background:var(--bg);border-radius:11px;overflow:hidden;position:relative;margin-bottom:10px">'
      +'<div style="width:'+m.qarz.foiz+'%;height:100%;background:linear-gradient(90deg,'+c("sky")+','+c("mint")+')"></div>'
      +'<span style="position:absolute;left:10px;top:3px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:'+(m.qarz.foiz>24?"#0A1118":c("txt"))+'">'
      +fmt(m.qarz.tolangan)+'$ / '+fmt(m.qarz.jami)+'$</span></div><div class="grid">'
      +kpi("Kerakli temp",m.qarz.temp?fmt(m.qarz.temp):"—","$/oy",m.qarz.oylik>=m.qarz.temp?c("mint"):c("coral"),"")
      +kpi("Hozirgi temp",fmt(m.qarz.oylik),"$/oy","","")
      +kpi("Qolgan oy",m.qarz.oyQ||"—","oy","",m.qarz.muddat)+'</div></div>';
  }

  h+='<div class="card"><div class="lbl"><span>Yozuvlar</span><b>'+(D.Yozuv||[]).length+'</b></div>';
  (D.Yozuv||[]).slice().reverse().slice(0,30).forEach(function(e){
    var sikl={Karta:"Hisob",Hisob:"Shaxsiy",Shaxsiy:"Karta"};
    h+='<div class="row"><span style="font-family:var(--mono);font-size:9.5px;color:var(--dim);min-width:34px">'+String(e.sana).slice(5,10)+'</span>'
      +'<button class="tag" style="background:'+(KCOL[e.kassa]||c("dim"))+'" onclick="yangi(\'Yozuv\',\''+e.id+'\',\'kassa\',\''+(sikl[e.kassa]||"Karta")+'\')">'+String(e.kassa||"?").slice(0,3)+'</button>'
      +'<span style="flex:1;color:var(--mute);font-size:10.5px">'+esc(e.cat||e.tur)+(e.izoh?" · "+esc(e.izoh):"")+'</span>'
      +'<span style="font-family:var(--mono);font-size:11px;color:'+(e.tur==="kirim"?c("mint"):e.tur==="transfer"?c("lav"):c("coral"))+'">'
      +(e.tur==="kirim"?"+":e.tur==="transfer"?"→":"−")+fmt(e.summa)+'</span>'
      +'<button class="btn2" style="padding:2px 7px;font-size:11px" onclick="ochir(\'Yozuv\',\''+e.id+'\')">×</button></div>';
  });
  return h+'</div>';
}
function kpi(k,v,u,col,s){
  return '<div class="kpi"><div class="k">'+k+'</div><div class="v" style="color:'+(col||c("txt"))+'">'+v
    +(u?' <span style="font-size:9px;color:var(--dim)">'+u+'</span>':'')+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';
}

function ekranKitob(m){
  var h='<div class="card"><div class="lbl"><span>Tarqatuvchi balansi</span><b>'+mln(m.dist.qarz)+' mln qarzdor</b></div>'
    +'<div style="height:20px;background:var(--bg);border-radius:10px;overflow:hidden;position:relative;margin-bottom:9px">'
    +'<div style="width:'+m.dist.foiz+'%;height:100%;background:linear-gradient(90deg,'+c("sky")+','+c("mint")+')"></div>'
    +'<span style="position:absolute;left:9px;top:2px;font-family:var(--mono);font-size:10px;font-weight:700;color:'+(m.dist.foiz>24?"#0A1118":c("txt"))+'">'
    +fmt(m.dist.tol)+' / '+fmt(m.dist.bosh+m.dist.yangi)+'</span></div>'
    +'<div class="grid">'+kpi("Qoldiq qarz",mln(m.dist.qarz),"mln",c("amber"),"")
    +kpi("Undagi ombor",mln(m.ombor),"mln","","sotilmagan nusxa")+'</div><div style="margin-top:9px">';
  m.dist.harakat.slice().reverse().slice(0,6).forEach(function(x){
    h+='<div class="row"><span style="font-family:var(--mono);font-size:9px;color:var(--dim);min-width:34px">'+String(x.sana).slice(5,10)+'</span>'
      +'<span style="flex:1;color:var(--mute);font-size:9.5px">'+(x.tur==="tolov"?"to'lov":"yangi tiraj")+'</span>'
      +'<span style="font-family:var(--mono);font-size:10.5px;color:'+(x.tur==="tolov"?c("mint"):c("coral"))+'">'
      +(x.tur==="tolov"?"−":"+")+fmt(x.summa)+'</span></div>';
  });
  h+='</div></div>';

  h+='<div class="grid" style="margin-bottom:10px">'
    +kpi("Muzlagan kapital",mln(m.muzlagan),"mln",c("coral"),"tugallanmagan kitoblarda")
    +kpi("Royalty hisoblangan",mln(m.kitob.reduce(function(a,x){return a+x.roy},0)),"mln","","")+'</div>';

  h+='<div class="card"><div class="lbl"><span>Kitob foydasi</span><b>mln so\'m</b></div>'+chart("g4",optKitob(m))+'</div>';

  h+='<div class="card"><div class="lbl"><span>Sotuv va qoldiq</span></div>';
  m.kitob.filter(function(b2){return b2.tiraj>0}).forEach(function(b2){
    var jam=Math.max(1,b2.sot+b2.qoldiq);
    h+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:6px;margin-bottom:4px">'
      +'<span style="font-family:var(--disp);font-size:13.5px">'+esc(b2.nom)+'</span>'
      +'<span style="font-family:var(--mono);font-size:9.5px;color:var(--mute)">'+fmt(b2.sot)+' / '+fmt(b2.qoldiq)+'</span></div>'
      +'<div class="bar" style="height:9px"><div style="width:'+(b2.sot/jam*100)+'%;background:'+c("mint")+'"></div>'
      +'<div style="width:'+(b2.qoldiq/jam*100)+'%;background:'+c("card3")+'"></div></div></div>';
  });
  h+='</div>';

  h+='<div class="card"><div class="lbl"><span>Kitob P&L</span></div>';
  m.kitob.forEach(function(b2){
    h+='<div style="padding:10px 0;border-bottom:1px solid var(--card2)">'
      +'<div style="display:flex;justify-content:space-between;gap:8px">'
      +'<div><div style="font-family:var(--disp);font-size:15px">'+esc(b2.nom)+'</div>'
      +'<div style="font-size:9.5px;color:var(--dim);margin-top:3px">'+esc(b2.izoh||"")+'</div></div>'
      +'<div style="text-align:right"><div style="font-family:var(--mono);font-size:17px;font-weight:700;color:'+(b2.sof>=0?c("mint"):c("coral"))+'">'+mln(b2.sof)+'</div>'
      +'<div style="font-size:8px;color:var(--dim)">mln sof</div></div></div>'
      +'<div style="font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:6px">xarajat '+mln(b2.xar)+' · tushum '+mln(b2.tus)+' · tannarx '+fmt(b2.tannarx)+' · royalty '+b2.foiz+'%</div>'
      +(b2.tirajlar&&b2.tirajlar.length?'<div style="font-family:var(--mono);font-size:8.5px;color:var(--dim);margin-top:3px">'
        +b2.tirajlar.map(function(t){return t.raqam+'-tiraj '+fmt(n(t.nusxa))+'\u00d7'+fmt(n(t.narxDona))+(t.holat==="yopilgan"?" \u2713":"")}).join(" \u00b7 ")+'</div>':'')
      +'</div>';
  });
  return h+'</div>';
}

function ekranHayot(m){
  var h='<div class="grid" style="margin-bottom:10px">'
    +kpi("Vazn",m.vazn===null?"—":m.vazn,m.vazn?"kg":"","","")
    +kpi("Mashg'ulot 7 kun",m.sport7+"/3","",m.sport7>=3?c("mint"):c("coral"),"")
    +kpi("Bomdod 7 kun",m.bomdod7+"/7","",m.bomdod7>=6?c("mint"):c("amber"),"")
    +kpi("Oilaviy vaqt",m.oila7,"soat",m.oila7>=6?c("mint"):c("amber"),"ish aralashmagan")+'</div>';
  if(m.vaznSer.length>1)h+='<div class="card"><div class="lbl"><span>Vazn trendi</span></div>'+chartSm("g5",optVazn(m))+'</div>';
  h+='<div class="card"><div class="lbl"><span>Oxirgi 14 kun</span></div>';
  [["Bomdod","bomdod",c("lav")],["Mashg'ulot","sport",c("mint")],["O'qish","oqish",c("sky")]].forEach(function(x){
    h+='<div style="margin-bottom:11px"><div style="font-size:10px;color:var(--mute);margin-bottom:5px">'+x[0]+'</div><div style="display:flex;gap:4px">';
    for(var i=13;i>=0;i--){
      var dt=dOff(-i),r=(D.Soglik||[]).filter(function(y){return String(y.sana).slice(0,10)===dt})[0];
      h+='<div style="flex:1;height:26px;border-radius:8px;background:'+(r&&tr(r[x[1]])?x[2]:c("card2"))+'"></div>';
    }
    h+='</div></div>';
  });
  return h+'</div>';
}

function ekranMaqsad(m){
  var h="";
  ["work","life"].forEach(function(soha){
    var lst=(D.Target||[]).filter(function(t){return t.soha===soha});
    if(!lst.length)return;
    h+='<div class="card"><div class="lbl"><span>'+(soha==="work"?"Work target":"Life target")+'</span><b>'
      +lst.filter(function(t){return t.holat!=="Bajarildi"}).length+' ochiq</b></div>';
    lst.forEach(function(t){
      var dd=kunTo(t.muddat),done=t.holat==="Bajarildi";
      h+='<div style="padding:9px 0;border-bottom:1px solid var(--card2);opacity:'+(done?.5:1)+'">'
        +'<div style="font-size:12.5px;line-height:1.4;'+(done?"text-decoration:line-through":"")+'">'+esc(t.nom)+'</div>'
        +'<div style="display:flex;gap:7px;align-items:center;margin-top:6px;flex-wrap:wrap">'
        +'<select style="width:auto;padding:5px 8px;font-size:10px" onchange="yangi(\'Target\',\''+t.id+'\',\'holat\',this.value)">'
        +["Boshlanmagan","Ishda","Kutilyapti","Bajarildi"].map(function(x){return '<option'+(t.holat===x?" selected":"")+'>'+x+'</option>'}).join("")
        +'</select><span style="font-family:var(--mono);font-size:9.5px;color:'+(dd<0?c("coral"):dd<=10?c("amber"):c("dim"))+'">'
        +(done?"":(dd<0?(-dd)+" kun o'tdi":dd+" kun"))+'</span>'
        +'<span style="font-size:9.5px;color:var(--dim)">'+esc(t.cat)+'</span></div></div>';
    });
    h+='</div>';
  });
  return h;
}

function ekranSozla(m){
  var h='<div class="card"><div class="lbl"><span>Joriy qoldiq</span><b>to\'g\'rilash</b></div>'
    +'<p style="font-size:11px;color:var(--dim);line-height:1.5;margin:0 0 10px">Botga ham yozsangiz bo\'ladi: "kartada 5527658 bor"</p>';
  KAS.forEach(function(k){
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      +'<span style="width:9px;height:9px;border-radius:3px;background:'+KCOL[k]+'"></span>'
      +'<span style="flex:1;font-size:11.5px">'+KNOM[k]+'</span>'
      +'<span style="font-family:var(--mono);font-size:10.5px;color:'+(m.kas[k]<0?c("coral"):c("dim"))+';min-width:76px;text-align:right">'+fmt(m.kas[k])+'</span>'
      +'<input style="width:100px;padding:7px 9px;font-size:11px" inputmode="decimal" placeholder="haqiqiy" onchange="qoldiqSet(\''+k+'\',Number(this.value)||0);this.value=\'\'"></div>';
  });
  h+='</div><div class="card"><div class="lbl"><span>Ma\'lumot</span></div>'
    +'<p style="font-size:11.5px;color:var(--mute);line-height:1.5;margin:0 0 10px">Google Sheets\'da saqlanadi. Yo\'qolmaydi.</p>'
    +'<button class="btn2" onclick="qayta()">Qayta yuklash</button></div>';
  return h;
}
function qoldiqSet(k,t){
  var Y=D.Yozuv||[];
  var inn=Y.filter(function(x){return x.tur==="kirim"&&x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)
    +Y.filter(function(x){return x.tur==="transfer"&&x.kassaTo===k}).reduce(function(a,x){return a+n(x.summa)},0);
  var out=Y.filter(function(x){return x.tur==="chiqim"&&x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0)
    +Y.filter(function(x){return x.tur==="transfer"&&x.kassa===k}).reduce(function(a,x){return a+n(x.summa)},0);
  kassaBelgila(k,t-inn+out);
}
function qayta(){document.getElementById("app").innerHTML='<div class="load">Yuklanyapti…</div>';yukla().then(render).catch(xatoKor)}

/* ═════ RENDER ═════ */
var TABS=[["bugun","Bugun"],["pul","Pul"],["kitob","Kitob"],["hayot","Hayot"],["maqsad","Maqsad"],["sozla","Sozlash"]];
function render(){
  CH=[];
  var m=hisob();
  var nomi=TABS.filter(function(t){return t[0]===tab})[0][1];
  var h='<div class="top"><div><div class="brand">MFB · Mening hayotim</div><h1>'+nomi+'</h1></div>'
    +'<div class="meta">'+bugun()+'<div id="holat" style="color:'+c("mint")+'">'+esc(holat)+'</div></div></div>';
  if(tab==="bugun")h+=ekranBugun(m);
  if(tab==="pul")h+=ekranPul(m);
  if(tab==="kitob")h+=ekranKitob(m);
  if(tab==="hayot")h+=ekranHayot(m);
  if(tab==="maqsad")h+=ekranMaqsad(m);
  if(tab==="sozla")h+=ekranSozla(m);
  document.getElementById("app").innerHTML=h;
  document.getElementById("nav").innerHTML=TABS.map(function(t){
    return '<button class="'+(tab===t[0]?"on":"")+'" onclick="tab=\''+t[0]+'\';render();window.scrollTo(0,0)"><i></i>'+t[1]+'</button>';
  }).join("");
  setTimeout(chizGrafik,30);
}
function xatoKor(e){
  document.getElementById("app").innerHTML='<div class="card"><div class="lbl"><span>Xato</span></div>'
    +'<p style="font-size:12px;color:'+c("coral")+';line-height:1.5">'+esc(String(e))+'</p>'
    +'<button class="btn" style="margin-top:10px" onclick="qayta()">Qayta urinish</button></div>';
}
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}}catch(e){}
yukla().then(render).catch(xatoKor);
</script>
